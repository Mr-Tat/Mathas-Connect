_format_version: '2.1'
services:
  - name: auth
    url: http://mathas-mixed-auth:9999
    routes:
      - name: auth
        strip_path: true
        paths: [/auth/v1/]
  - name: rest
    url: http://mathas-mixed-rest:3000
    routes:
      - name: rest
        strip_path: true
        paths: [/rest/v1/]
  - name: results
    url: http://mathas-mixed-results:9000
    routes:
      - name: results
        strip_path: true
        paths: [/functions/v1/connect-results]
  - name: api
    url: http://mathas-mixed-api:9000
    routes:
      - name: api
        strip_path: true
        paths: [/functions/v1/connect-api]
plugins:
  - name: cors
    config:
      origins: ['*']
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version]
      exposed_headers: [Content-Range]
      max_age: 3600
