<script>
"use strict";
/* Moteur indépendant : tous les nombres sont des dixièmes entiers. */
const LEVELS={even:{name:"1. Pairs",total:10,page:5,passes:2},odd:{name:"2. Impairs",total:10,page:5,passes:2},mix:{name:"3. Mélangés",total:10,page:5,passes:2},gi1:{name:"4.1 · Longueur donnée",total:6,page:6,passes:1},gi2:{name:"4.2 · Mesurer d’abord",total:6,page:6,passes:1},decimal1:{name:"5.1 · Découvrir",total:5,page:5,passes:1},decimal2:{name:"5.2 · S’entraîner",total:10,page:5,passes:1},decimal3:{name:"5.3 · Maîtriser",total:15,page:5,passes:1},g1:{name:"6.1 · 5 segments",total:5,page:5,passes:1},g2:{name:"6.2 · 10 segments",total:10,page:5,passes:1},g3:{name:"6.3 · Mesurer et placer",total:10,page:5,passes:1}};
const ORDER=Object.keys(LEVELS),KEY="mathas.milieu-segment.pilot.v2",RUNKEY=KEY+".run",LEGACY="mathas.milieu-segment.pilot.v1",TROPHIES=[5,10,20];
const DECIMALS=["decimal1","decimal2","decimal3"],paidHelp=id=>id==="decimal2"||id==="decimal3";
const cupMetal=id=>["even","odd"].includes(id)||id.endsWith("sudden5")?"bronze":id==="mix"||id==="decimal"||id.endsWith("sudden10")?"silver":"gold";
const CUP_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 50" aria-hidden="true"><path d="M12 5h24v12c0 11-5 18-12 18S12 28 12 17V5Z" fill="var(--cup)" stroke="var(--cup-dark)" stroke-width="2"/><path d="M13 10H5v6c0 10 6 13 12 13M35 10h8v6c0 10-6 13-12 13" stroke="var(--cup-dark)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M18 9h4v18c-4-2-6-9-4-18Z" fill="var(--cup-gloss)" opacity=".83"/><path d="M22 33h4v8h-4Z" fill="var(--cup-dark)"/><path d="M14 44h20v4H14Z" fill="var(--cup)" stroke="var(--cup-dark)" stroke-width="2"/></svg>';
const cupSymbol=id=>'<span class="milieu-cup-art" data-trophy-color="'+cupMetal(id)+'">'+CUP_SVG+'</span>';
const trophySpecs=[
 ["even","1. Pairs","Réussis deux séries de deux pages à 100 % sans aide."],
 ["odd","2. Impairs","Réussis deux séries de deux pages à 100 % sans aide."],
 ["mix","3. Mélangés","Réussis deux séries de deux pages à 100 % sans aide."],
 ["integers:segments","4. Segments entiers","Réussis les activités 4.1 et 4.2 à 100 % sans aide."],
 ["decimal","5. Calculs décimaux","Réussis 5.1, 5.2 et 5.3 à 100 %. Les aides gratuites de 5.1 sont autorisées ; aucune aide en 5.2 et 5.3."],
 ["decimals:segments","6. Segments décimaux","Réussis 6.1, 6.2 et 6.3 à 100 % sans aide."],
 ...["integers","decimals"].flatMap(f=>TROPHIES.map(t=>[f+":sudden"+t,"Mort subite · "+(f==="integers"?"Entiers":"Décimaux")+" · "+t,"Réussis au moins "+t+" segments dans une partie de Mort subite."]))
];
function cupMarkup(id,extra="cup"){const status=progress.cups[id]?"Trophée obtenu":"Trophée à obtenir";return '<span class="'+extra+' '+cupMetal(id)+(progress.cups[id]?' earned':' off')+'" title="'+status+'" role="img" aria-label="'+status+'">'+cupSymbol(id)+'</span>'}
function trophyCount(){return trophySpecs.filter(([id])=>progress.cups[id]===true).length}
function detailDialog(id,title,contents){
 const old=app.querySelector("dialog.reward-detail");if(old){if(old.open)old.close();old.remove()}
 const d=document.createElement("dialog");d.id=id;d.className="reward-detail";d.setAttribute("aria-labelledby",id+"Title");
 d.innerHTML='<div class="reward-detail-head"><h2 id="'+id+'Title">'+esc(title)+'</h2><button type="button" class="reward-close" aria-label="Fermer">✕</button></div><div class="reward-detail-body">'+contents+'</div><div class="actions"><button type="button" class="primary reward-done">Fermer</button></div>';
 d.querySelector(".reward-close").onclick=d.querySelector(".reward-done").onclick=()=>d.close();d.addEventListener("close",()=>d.remove(),{once:true});app.append(d);d.showModal();return d;
}
function showTrophyDetails(){
 const rows=trophySpecs.map(([id,label,rule])=>'<div class="reward-row">'+cupMarkup(id,"reward-cup")+'<div><strong>'+esc(label)+'</strong><p>'+esc(rule)+'</p></div><span class="reward-state '+(progress.cups[id]?'done':'')+'">'+(progress.cups[id]?'Acquis':'À gagner')+'</span></div>').join("");

function validatePlacement(q){const n=q.placeTick??q.marked;if(!Number.isInteger(n)){run.feedback="Place d’abord ton point sur la latte.";render();return}noteAttempt(q,{stage:"place",tick:n});q.marked=n;if(n===q.n/2){q.done=true;if(q.first!==false){q.first=true;run.correct++}run.feedback="✓ Correct !";if(run.mode&&!run.practice&&!officialRequired){progress.records[recordKey(run.id,run.mode)]=Math.max(progress.records[recordKey(run.id,run.mode)]||0,run.correct);if(run.mode==="sudden")for(const t of TROPHIES)if(run.correct>=t)progress.cups[cupKey(run.id,t)]=true;save()}checkpoint();render()}else failGeo("Ce n’est pas le milieu. Réessaie.")}

function nextGeo(){if(run.mode){const n=shuffle(pool(run.id).filter(x=>!run.used.includes(x)))[0];if(n===undefined)run.used=[];let q=questions(run.id,1)[0];q.n=officialRequired?seededNext(run):n??shuffle(pool(run.id))[0];run.used.push(q.n);run.q.push(q);run.index++;run.feedback="";render();return}const [first,end]=sheetBounds();const next=Array.from({length:end-first},(_,j)=>first+j).find(i=>!run.q[i].done);if(next!==undefined){run.index=next;run.feedback="";render();return}advanceGeoPage()}
function validateGeo(){const q=current();if(q.done){nextGeo();return}if(q.stage==="measure"){if(parse10(q.measure)===null){run.feedback="Écris la longueur.";render();return}if(!Number.isInteger(q.measureTick)){run.feedback="Choisis d’abord une graduation avec la loupe.";render();return}noteAttempt(q,{stage:"measure",tick:q.measureTick,value:parse10(q.measure)});if(q.measureTick!==q.n||parse10(q.measure)!==q.n){failGeo("Vérifie la graduation et la longueur.");return}q.measureKnown=true;q.stage="calc";q.revealed=true;run.feedback="";render()}else if(q.stage==="calc"){if(!q.revealed&&!isMeasured(run.id))return;if(parse10(q.answer)===null){run.feedback="Écris ta réponse.";render();return}noteAttempt(q,{stage:"calc",value:parse10(q.answer)});if(parse10(q.answer)!==q.n/2){failGeo("Vérifie ton calcul.");return}q.calcCorrect=true;q.stage="place";q.lens=5;run.feedback="";render()}else if(q.stage==="place")validatePlacement(q)}

const fieldAvailable=el=>!!el&&app.contains(el)&&!run?.q[Number(el.dataset.i)]?.done;
