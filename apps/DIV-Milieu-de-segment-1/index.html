<header><div><strong>MATH'AS / LA MOITIÉ</strong> <small>· v0.3.0 Connect candidat</small></div><div><button id="hubReturn" hidden>← Math’as</button> <button id="home" hidden>← Accueil</button> <button id="full">⛶ Plein écran</button></div></header>
<aside id="connectAccount" hidden></aside><main id="app"></main><footer id="modeFooter">Progression enregistrée sur cet appareil · Mode libre</footer><button id="master" class="master-toggle" aria-pressed="false" hidden>Master mode</button>
<script>
"use strict";
/* Moteur indépendant : tous les nombres sont des dixièmes entiers. */
const LEVELS={even:{name:"1. Pairs",total:10,page:5,passes:3},odd:{name:"2. Impairs",total:10,page:5,passes:3},mix:{name:"3. Mélangés",total:10,page:5,passes:3},gi1:{name:"4.1 · Longueur donnée",total:6,page:1,passes:1},gi2:{name:"4.2 · Mesurer d’abord",total:6,page:1,passes:1},decimal1:{name:"5.1 · Découvrir",total:5,page:5,passes:1},decimal2:{name:"5.2 · S’entraîner",total:10,page:5,passes:1},decimal3:{name:"5.3 · Maîtriser",total:15,page:5,passes:1},g1:{name:"6.1 · 5 segments",total:5,page:1,passes:1},g2:{name:"6.2 · 10 segments",total:10,page:1,passes:1},g3:{name:"6.3 · Mesurer et placer",total:10,page:1,passes:1}};
const ORDER=Object.keys(LEVELS),KEY="mathas.milieu-segment.pilot.v2",RUNKEY=KEY+".run",LEGACY="mathas.milieu-segment.pilot.v1",TROPHIES=[5,10,20];
const DECIMALS=["decimal1","decimal2","decimal3"],paidHelp=id=>id==="decimal2"||id==="decimal3";
const cupMetal=id=>["even","odd"].includes(id)||id.endsWith("sudden5")?"bronze":id==="mix"||id==="decimal"||id.endsWith("sudden10")?"silver":"gold";
const cupSymbol=id=>({bronze:"🥉",silver:"🥈",gold:"🥇"})[cupMetal(id)];
const isMeasured=id=>id==="gi2"||id==="g3";
const family=id=>id.startsWith("gi")||["even","odd","mix"].includes(id)?"integers":"decimals";
const geoIds=f=>f==="integers"?["gi1","gi2"]:["g1","g2","g3"];
const recordKey=(id,mode)=>family(id)+":"+mode;
const cupKey=(id,t)=>recordKey(id,"sudden")+t;
const fmt=n=>String(n/10).replace(".",",");
function parse10(v){const s=String(v).trim().replace(",",".");if(!/^\d+(?:\.\d+)?$/.test(s))return null;const [a,b=""]=s.split(".");if(b.slice(1).replace(/0/g,""))return null;const n=Number(a)*10+Number(b[0]||0);return Number.isSafeInteger(n)?n:null}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(id){if(id==="even")return Array.from({length:10},(_,i)=>(i+1)*20);if(id==="odd")return Array.from({length:10},(_,i)=>(i*2+1)*10);if(id==="mix")return Array.from({length:20},(_,i)=>(i+1)*10);if(DECIMALS.includes(id))return Array.from({length:20},(_,i)=>[2,4,6,8].map(d=>i*10+d)).flat();if(id==="gi1"||id==="gi2")return pool("mix");return Array.from({length:100},(_,i)=>(i+1)*2).filter(n=>n>=20&&n%10!==0)}
function questions(id,count){let values;if(id==="mix"){values=shuffle([...shuffle(pool("even")).slice(0,5),...shuffle(pool("odd")).slice(0,5)]).slice(0,count)}else values=shuffle(pool(id)).slice(0,count);return values.map((n,i)=>({n,word:id==="mix"||DECIMALS.includes(id)?i%2===0:false,answer:"",partA:"",partB:"",help:false,decomp:false,removed:0,clean:true,first:null,done:false,attempts:0,evidence:{helps:[],attempts:[]},stage:isMeasured(id)?"measure":"calc",measure:"",marked:null,lens:0}))}
function safeGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}}function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}function safeRemove(k){try{localStorage.removeItem(k)}catch{}}
function blank(){return {levels:{},records:{},cups:{}}}
function loadProgress(){const current=safeGet(KEY);if(current?.levels&&current?.records&&current?.cups)return current;const next=blank(),old=safeGet(LEGACY);if(old){for(const id of ["even","odd","mix","decimal"]){if(Array.isArray(old.levels?.[id]))next.levels[id]=old.levels[id];if(old.cups?.[id])next.cups[id]=true}safeSet(KEY,next)}return next}
const params=new URLSearchParams(typeof location==="undefined"?"":location.search),officialRequired=params.get("requireConnect")==="1"||params.get("connect")==="1",hubAccess=params.get("hub")==="toutes";
let official=null,connecting=false,officialMessage="",officialBusy=false,seedCursor=null,seedEvent=null,seedCount=0;
let progress=officialRequired?blank():loadProgress();
let run=null,practice=false,active=null,locked=false,storageFailed=false;
const draftKey=(test=practice)=>test?RUNKEY+".master":RUNKEY;
const master=document.getElementById("master");
function toggleMaster(){if(officialRequired||run&&!run.finished)return;if(!practice&&prompt("Mot de passe Master mode :")!=="Thecakeisalie")return;practice=!practice;showHome()}
master.onclick=toggleMaster;
function credited(r){return r.mode||!paidHelp(r.id)?r.correct:r.q.filter(q=>q.first===true&&q.clean).length}
function percent(r){return Math.round(100*credited(r)/LEVELS[r.id].total)}
const app=document.getElementById("app"),home=document.getElementById("home");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const scores=id=>progress.levels[id]||[];
const passing=id=>scores(id).filter(x=>x.score>=80).length>=LEVELS[id].passes;
const stageNumber=id=>({even:1,odd:2,mix:3,gi1:4,gi2:4,decimal1:5,decimal2:5,decimal3:5,g1:6,g2:6,g3:6})[id];
const classAllows=id=>!official||official.snapshot.teacherFree||stageNumber(id)<=official.snapshot.maxActivity;
const unlocked=id=>classAllows(id)&&(practice||official?.snapshot?.teacherFree||id==="decimal1"&&official?.snapshot?.state?.decimalUnlocked||id===ORDER[0]||passing(ORDER[ORDER.indexOf(id)-1]));
const challengesOpen=f=>classAllows(f==="integers"?"gi2":"g3")&&(practice||geoIds(f).every(passing));
const cupId=id=>id.startsWith("g")?family(id)+":segments":DECIMALS.includes(id)?"decimal":id;
function save(){if(!officialRequired&&!safeSet(KEY,progress))storageFailed=true}
const activeRunKey=()=>officialRequired?official?.storageKey+".run":draftKey();
function checkpoint(){if(run&&(!run.finished||officialRequired&&!run.ack)&&(!officialRequired||official)&&!safeSet(activeRunKey(),run))storageFailed=true}
function storeResult(){if(run.practice)return;const id=run.id;if(run.mode){progress.records[recordKey(run.id,run.mode)]=Math.max(progress.records[recordKey(run.id,run.mode)]||0,run.correct);if(run.mode==="sudden")for(const t of TROPHIES)if(run.correct>=t)progress.cups[cupKey(run.id,t)]=true;save();return}const score=percent(run);let a=scores(id).slice();a.push({score,clean:run.q.every(q=>q.clean),at:Date.now()});a.sort((x,y)=>y.score-x.score||Number(y.clean)-Number(x.clean));progress.levels[id]=a.slice(0,LEVELS[id].passes);const perfect=x=>scores(x).filter(s=>s.score===100&&(x==="decimal1"||s.clean)).length>=LEVELS[x].passes;if(id.startsWith("g")){if(geoIds(family(id)).every(perfect))progress.cups[cupId(id)]=true}else if(DECIMALS.includes(id)){if(DECIMALS.every(perfect))progress.cups.decimal=true}else if(perfect(id))progress.cups[id]=true;save()}
function showHome(){run=null;active=null;locked=false;home.hidden=true;master.hidden=officialRequired;master.textContent=practice?"Quitter Master mode":"Master mode";master.setAttribute?.("aria-pressed",String(practice));if(officialRequired&&!official){app.innerHTML='<section class="paper"><h1>Connexion Math’as Connect nécessaire</h1><p>Une identité approuvée par le serveur est nécessaire pour commencer un parcours officiel.</p><div class="actions"><button id="connectRetry">Actualiser la connexion</button><button class="primary" id="freeLaunch">Jouer librement (sans XP Connect)</button></div></section>';document.getElementById("connectRetry").onclick=()=>void connectOfficial();if(officialMessage){const msg=document.createElement("p");msg.textContent=officialMessage;app.querySelector("section").append(msg)}document.getElementById("freeLaunch").onclick=()=>{const u=new URL(location.href);u.search="";if(hubAccess){u.searchParams.set("hub","toutes");for(const k of ["class","name","joueur"]){if(params.has(k))u.searchParams.set(k,params.get(k))}}location.assign(u.href)};return}const cup=(id)=> '<span class="cup '+cupMetal(id)+' '+(progress.cups[id]?"":"off")+'" title="Trophée '+cupMetal(id)+'" aria-label="'+(progress.cups[id]?"Trophée obtenu":"Trophée à obtenir")+'">'+cupSymbol(id)+'</span>';
const tile=(id,symbol)=>{let a=scores(id),ok=unlocked(id);return '<button class="tile" data-start="'+id+'" '+(ok?"":"disabled")+'><b>'+symbol+'</b><span>'+LEVELS[id].name+'</span><small class="dots">'+Array.from({length:LEVELS[id].passes},(_,i)=>a[i]?a[i].score+" %":"○").join(" · ")+'</small>'+(!id.startsWith("g")&&!DECIMALS.includes(id)?cup(cupId(id)):"")+(ok?"":'<span class="lock">🔒 '+(!classAllows(id)?"Ton professeur ouvrira la suite":"Activité précédente")+'</span>')+'</button>'};

function lensSVG(center){const a=Math.max(0,Math.min(190,Math.round(center)-5));return '<svg viewBox="0 0 330 70" aria-label="Graduations agrandies"><rect width="330" height="70" fill="#f7e5b6"/>'+ticks(a,a+10,15,30,3,37)+'<g>'+Array.from({length:11},(_,i)=>'<rect data-tick="'+(a+i)+'" x="'+(i*30)+'" y="0" width="30" height="70" fill="transparent" style="cursor:crosshair"/>').join("")+'</g></svg>'}
function geometry(){const q=current();const stage=q.stage;let ruler=stage==="measure"||stage==="place";let steps=(isMeasured(run.id)?["measure","calc","place"]:["calc","place"]).map(s=>'<span class="'+(s===stage?"on":"")+'">'+({measure:"1. Mesurer",calc:isMeasured(run.id)?"2. Calculer":"1. Calculer",place:isMeasured(run.id)?"3. Placer":"2. Placer"}[s])+'</span>').join("");
return '<div class="stepbar">'+steps+'</div><div class="geo"><div class="rulerWrap" id="rulerWrap" '+(ruler?'tabindex="0" aria-label="Latte : flèches pour déplacer la loupe, Entrée pour sélectionner"':'')+'>'+diagram(q,ruler)+'</div>'+(ruler?'<div class="muted">'+(stage==="measure"?"Clique sur la graduation de l’extrémité.":"Clique sur la graduation du milieu.")+'</div><div class="lens" id="lens">'+lensSVG(q.lens??5)+'</div>':'')+(stage==="measure"?'<div class="geoAnswer">Longueur = <input class="answer" data-i="'+run.index+'" data-field="measure" inputmode="decimal" aria-label="Longueur en centimètres" value="'+esc(q.measure)+'" '+(q.done?"readonly":"")+'> cm</div>':stage==="calc"?(q.revealed||isMeasured(run.id)?(q.help?legend():"")+equation(q,run.index,true):'<button id="reveal" class="secondary">Cliquer sur le segment</button>'):'<div class="geoAnswer">Moitié : '+fmt(q.n/2)+' cm</div>'+(q.calcCorrect&&q.help&&q.removed?'<div class="helparea">'+Array.from({length:q.removed},()=>halfHtml).join(" ")+'</div>':""))+'</div><div role="status" class="notice '+(run.feedback&&run.feedback!=="✓ Correct !"?"bad":"")+'">'+esc(run.feedback)+'</div><div class="actions">'+(stage==="place"&&!q.done?'':stage==="calc"&&!q.revealed&&!isMeasured(run.id)?'':'<button class="primary" id="ok">'+(q.done?"Suivant →":"✓ Valider")+'</button>')+'</div>'}
function selectTick(n){const q=current();if(q.done||!Number.isInteger(n)||n<0||n>200)return;if(q.stage==="measure"){q.measureTick=n;run.feedback="";checkpoint();render();app.querySelector("input[data-field=measure]")?.focus()}else if(q.stage==="place"){noteAttempt(q,{stage:"place",tick:n});q.marked=n;if(n===q.n/2){q.done=true;if(q.first!==false){q.first=true;run.correct++}run.feedback="✓ Correct !";if(run.mode&&!run.practice&&!officialRequired){progress.records[recordKey(run.id,run.mode)]=Math.max(progress.records[recordKey(run.id,run.mode)]||0,run.correct);if(run.mode==="sudden")for(const t of TROPHIES)if(run.correct>=t)progress.cups[cupKey(run.id,t)]=true;save()}checkpoint();render()}else failGeo("Ce n’est pas le milieu. Réessaie.")}}
function failGeo(message){const q=current();q.first=false;q.attempts++;if(run.mode){run.lives--;q.done=true;if(run.lives<=0){finish();return}run.feedback="Un cœur perdu.";checkpoint();render();return}run.feedback=message;checkpoint();render()}
function nextGeo(){if(run.mode){const n=shuffle(pool(run.id).filter(x=>!run.used.includes(x)))[0];if(n===undefined)run.used=[];let q=questions(run.id,1)[0];q.n=officialRequired?seededNext(run):n??shuffle(pool(run.id))[0];run.used.push(q.n);run.q.push(q);run.index++;run.feedback="";render();return}if(run.index+1>=run.q.length){finish();return}run.index++;run.feedback="";render()}
function validateGeo(){const q=current();if(q.done){nextGeo();return}if(q.stage==="measure"){if(parse10(q.measure)===null){run.feedback="Écris la longueur.";render();return}if(!Number.isInteger(q.measureTick)){run.feedback="Choisis d’abord une graduation avec la loupe.";render();return}noteAttempt(q,{stage:"measure",tick:q.measureTick,value:parse10(q.measure)});if(q.measureTick!==q.n||parse10(q.measure)!==q.n){failGeo("Vérifie la graduation et la longueur.");return}q.measureKnown=true;q.stage="calc";q.revealed=true;run.feedback="";render()}else if(q.stage==="calc"){if(!q.revealed&&!isMeasured(run.id))return;if(parse10(q.answer)===null){run.feedback="Écris ta réponse.";render();return}noteAttempt(q,{stage:"calc",value:parse10(q.answer)});if(parse10(q.answer)!==q.n/2){failGeo("Vérifie ton calcul.");return}q.calcCorrect=true;q.stage="place";q.lens=5;run.feedback="";render()}}
function validate(){if(locked||!run||run.finished)return;locked=true;try{isGeo()?validateGeo():validateClassic()}finally{locked=false}}
function renderResult(){home.hidden=false;master.hidden=true;active=null;const score=run.mode?run.correct:percent(run);app.innerHTML='<section class="paper result"><h1>'+ (run.mode?"Fin de partie":"Série terminée")+'</h1><b>'+score+(run.mode?"":" %")+'</b><p>'+(run.mode?"Segments réussis":credited(run)+" / "+LEVELS[run.id].total+(paidHelp(run.id)?" sans erreur ni aide":" au premier essai"))+'</p><p class="muted">'+(run.practice?"Master mode · Aucun résultat enregistré":run.mode?"Record : "+progress.records[recordKey(run.id,run.mode)]:score>=80?"✓ Série réussie":"Encore un effort !")+'</p><div class="actions" style="justify-content:center"><button id="again" class="primary">Recommencer</button><button id="back">Accueil</button></div></section>';document.getElementById("again").onclick=()=>start(run.id,run.mode);document.getElementById("back").onclick=showHome}
function setInput(el,val){const q=run.q[Number(el.dataset.i)];q[el.dataset.field]=val;el.value=val;active=el;checkpoint()}
function bind(){app.querySelectorAll("input[data-i]").forEach(el=>{el.onfocus=()=>active=el;el.oninput=()=>setInput(el,el.value);el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const inputs=[...app.querySelectorAll("input[data-field=answer]:not([readonly])")];const idx=inputs.indexOf(el);if(!isGeo()&&idx>=0&&idx<inputs.length-1)inputs[idx+1].focus();else validate()}}});
app.querySelectorAll("[data-key]").forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{let el=active&&app.contains(active)&&!active.readOnly?active:app.querySelector("input[data-field=answer]:not([readonly]),input[data-field=measure]:not([readonly])");if(!el)return;const k=b.dataset.key;let a=el.selectionStart??el.value.length,z=el.selectionEnd??a;if(k==="⌫"){if(a===z)a=Math.max(0,a-1);setInput(el,el.value.slice(0,a)+el.value.slice(z));el.focus();el.setSelectionRange(a,a)}else{setInput(el,el.value.slice(0,a)+k+el.value.slice(z));el.focus();el.setSelectionRange(a+1,a+1)}}});
for(const id of ["ok","padOK"]){const b=document.getElementById(id);if(b)b.onclick=validate}
app.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>helpToggle(Number(b.dataset.help),b.dataset.kind));app.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>removeUnit(Number(b.dataset.undo),-1));
app.querySelectorAll("[data-drag]").forEach(b=>{let y=null,moved=false;b.onpointerdown=e=>{y=e.clientY;moved=false;b.setPointerCapture?.(e.pointerId)};b.onpointerup=e=>{if(y!==null&&e.clientY-y>15){moved=true;removeUnit(Number(b.dataset.drag),Math.max(1,Math.floor((e.clientY-y)/32)))}y=null};b.onpointercancel=()=>{y=null};b.onclick=()=>{if(!moved)removeUnit(Number(b.dataset.drag),1);moved=false}});
const reveal=()=>{current().revealed=true;render()};const rb=document.getElementById("reveal"),seg=document.getElementById("segment");if(rb){rb.onclick=reveal;seg.onclick=reveal;seg.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal()}}}
const hit=document.getElementById("rulerHit"),lens=document.getElementById("lens"),wrap=document.getElementById("rulerWrap");if(hit&&lens){const update=n=>{current().lens=Math.max(0,Math.min(200,n));lens.innerHTML=lensSVG(current().lens);const windowRect=document.getElementById("lensWindow");if(windowRect)windowRect.setAttribute("x",X+Math.max(0,Math.min(190,current().lens-5))*S)};const locate=e=>{const svg=hit.ownerSVGElement,r=svg.getBoundingClientRect();return Math.round(((e.clientX-r.left)*W/r.width-X)/S)};hit.onpointermove=e=>update(locate(e));hit.onpointerdown=e=>{e.preventDefault();update(locate(e));wrap.focus()};lens.onclick=e=>{const t=e.target.closest("[data-tick]");if(t)selectTick(Number(t.dataset.tick))};wrap.onkeydown=e=>{if(["ArrowLeft","ArrowRight","Enter"].includes(e.key)){e.preventDefault();if(e.key==="Enter")selectTick(current().lens);else update(current().lens+(e.key==="ArrowLeft"?-1:1))}}}
}
