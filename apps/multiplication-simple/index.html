function renderXpMeter(total,level,instant=false){

 const actual=Number.isSafeInteger(level)&&level>=1?level:levelAt(value);
 const start=threshold(actual-1),end=threshold(actual),width=end-start;

 if(!fill||!amount||!number||!track||!card)return;
 number.textContent=String(actual);
 amount.textContent=earned+' / '+width+' XP';
 fill.style.transitionDuration=instant||reducedMotion()?'0ms':'690ms';

 track.setAttribute('aria-valuenow',String(earned));

async function animateXpGain(xp){
 const total=Number(xp.total),delta=Number(xp.delta),appXp=Number(xp.appXp);
 if(!Number.isFinite(total)||!Number.isFinite(delta)||delta<=0)return;
 const start=Math.max(0,total-delta),startLevel=levelAt(start),endLevel=levelAt(total);
 const finish=()=>{showEarnedXp(appXp);renderXpMeter(total,endLevel,true);bumpXpMeter()};
 if(document.hidden){finish();return}
 // Le vol des XP reste actif, même si le navigateur préfère réduire les mouvements.
 renderXpMeter(start,startLevel,true);
 const el=xpElement();
 el.hidden=false;
 el.replaceChildren();
 const amount=document.createElement('strong');amount.textContent='+'+delta+' XP';
 const text=document.createElement('div');text.textContent='Bravo ! Tes XP rejoignent ta progression.';
 el.append(amount,text);
 if(endLevel>startLevel){
  const burst=document.createElement('div');
  burst.id='xp-levelburst';burst.textContent='✦ Niveau '+endLevel+' atteint ! ✦';el.append(burst);
 }
 el.classList.remove('open');
 void el.offsetWidth;
 el.classList.add('open');
 await pause(830);
 const target=document.getElementById('ce-xp-meter');
 if(target&&el.animate&&!document.hidden){
  const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();
  const dx=b.left+b.width/2-(a.left+a.width/2);
  const dy=b.top+b.height/2-(a.top+a.height/2);
  try{
   const movement=el.animate([
     {transform:'translate(-50%, 0) scale(1)',opacity:1},
     {transform:'translate(calc(-50% + '+dx+'px), '+dy+'px) scale(.16)',opacity:0}
   ],{duration:550,easing:'cubic-bezier(.4,0,.7,1)',fill:'forwards'});
   await movement.finished;
   movement.cancel();
  }catch{}
 }
 el.classList.remove('open');
 el.hidden=true;
 // La jauge monte APRES l'arrivée du pop-up, y compris au changement de niveau.
 const steps=Math.min(3,Math.max(0,endLevel-startLevel));
 if(endLevel-startLevel>3){finish();return}
 for(let i=0;i<steps;i++){
  const lvl=startLevel+i;
  renderXpMeter(threshold(lvl),lvl);
  await pause(740);
  renderXpMeter(threshold(lvl),lvl+1,true);
  bumpXpMeter();
  await pause(170);
 }
 renderXpMeter(total,endLevel);
 showEarnedXp(appXp);
 await pause(730);
 bumpXpMeter();
}
function queueXpGain(xp){
 xpVisualPending++;
 xpVisualQueue=xpVisualQueue.then(()=>animateXpGain(xp)).catch(error=>{
  console.warn('Animation XP interrompue',error);

 }).finally(()=>{xpVisualPending--});
}

const queueKey='ce-multiplication.pending.'+(session?.user?.id||'free')+'.v2';
const readQueue=()=>{try{const a=JSON.parse(localStorage.getItem(queueKey)||'[]');return Array.isArray(a)?a:[]}catch{return []}};
const saveQueue=q=>{if(q.length>1000)throw Error('File de synchronisation saturée : ne pas terminer de nouvelles parties avant reconnexion.');localStorage.setItem(queueKey,JSON.stringify(q))};
let draining=false, syncWarning='';
function showSync(){const v=document.getElementById('ce-sync');if(v){v.textContent=mode==='connected'?(syncWarning|| (readQueue().length?'En attente : '+readQueue().length:(!navigator.onLine?'Hors ligne':'Synchronisé'))):'';v.title=syncWarning||''}}
async function drain(){
 // Never resend pre-certification game-record messages as official school XP.
 // Historical pending entries are kept intact for audit, never submitted.
 if(mode==='connected'){
  if(readQueue().length)syncWarning='Anciens résultats non certifiés conservés : aucun XP envoyé.';
  showSync();return;
 }
 if(draining||mode!=='connected'||!cloud)return;
 draining=true;
 try{
  let q=readQueue();
  let conflicts=0;
  while(q.length){
   const e=q[0],a=(await cloud.auth.getSession()).data.session;
   if(!a){syncWarning='Session interrompue : résultats conservés sur cet appareil.';break;}
   if(e.expectedResetEpoch!==resetEpoch){q.shift();saveQueue(q);continue}
   e.expectedRevision=revision;
   const headers={apikey:KEY,authorization:'Bearer '+a.access_token,'content-type':'application/json'};
   let res,data;
   try{res=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify(e)});data=await res.json()}catch{syncWarning='Connexion indisponible : résultats en attente sur cet appareil.';break}
   if(res.ok&&data.ok){revision=data.revision;resetEpoch=data.resetEpoch??resetEpoch;q.shift();saveQueue(q);syncWarning='';conflicts=0;if(data.xp&&Number.isFinite(Number(data.xp.appXp))){xpUiVersion++;if(data.xp.delta>0)queueXpGain(data.xp);else if(!xpVisualPending){showEarnedXp(data.xp.appXp);renderXpMeter(data.xp.total,data.xp.level,true)}}continue}
   if(data.error==='stale_reset_epoch'){q.shift();saveQueue(q);break}
   if(data.error==='revision_conflict'&&conflicts++<2){
    const v=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})}).then(r=>r.json()).catch(()=>null);
    if(!v?.ok)break;revision=v.revision;resetEpoch=v.resetEpoch??0;continue;
   }
   syncWarning='Synchronisation en attente : réessaie avec une connexion stable.';console.warn('Partie non envoyée',data.error);break;
  }
 }catch(error){syncWarning='Synchronisation interrompue : résultats en attente sur cet appareil.';console.warn('Synchronisation interrompue',error)}finally{draining=false;showSync()}
}
window.addEventListener('online',()=>{syncWarning='';showSync();drain()});
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')drain()});

async function proofCall(action,payload){
 if(mode!=='connected'||!cloud||!session)throw Error('Session Connect requise');
 const current=(await cloud.auth.getSession()).data.session;
 if(!current?.access_token||current.user?.id!==session.user.id)throw Error('Session changée');
 const res=await fetch(URL+'/functions/v1/connect-multiplication-school',{
  method:'POST',headers:{apikey:KEY,authorization:'Bearer '+current.access_token,
  'content-type':'application/json'},body:JSON.stringify({action,classId,...payload})});
 const data=await res.json().catch(()=>null);
 if(!res.ok||data?.ok!==true)throw Error(data?.error||'proof_unavailable');
 return data;
}
function installNativeCertifiedProof(){
 const doc=iframe.contentDocument;
 if(mode!=='connected'||!certifiedClassic||!doc?.querySelector('#menuScreen')
  )return;
 const sudden=doc.getElementById('startSudden');
 if(sudden&&!doc.getElementById('mathasMultiThreeLives')){
  const button=doc.createElement('button');button.type='button';
  button.id='mathasMultiThreeLives';button.className=sudden.className;
  button.textContent='❤️ 3 vies';button.title='Trois erreurs possibles · preuve Connect';
  sudden.insertAdjacentElement('afterend',button);
 }
 const lives=doc.getElementById('mathasMultiThreeLives');
 if(sudden&&lives)lives.disabled=sudden.disabled;
 if(sudden&&lives&&!sudden.closest('.mathas-multi-survival-options')){
  const group=doc.createElement('div');group.className='mathas-multi-survival-options';
  sudden.parentElement.insertBefore(group,sudden);
  group.append(lives,sudden);
 }
 for(const card of doc.querySelectorAll('#hardMenu .hard-level-card')){
  const native=card.querySelector('.hard-sudden');
  if(!native||card.querySelector('.mathas-multi-hard-three-lives'))continue;
  const button=doc.createElement('button');button.type='button';
  button.className='hard-sudden mathas-multi-hard-three-lives';
  button.textContent='❤️ 3 vies';button.disabled=native.disabled;
  native.insertAdjacentElement('afterend',button);
 }
 if(doc.__mathasMultiCertifiedRouter)return;
 doc.__mathasMultiCertifiedRouter=true;
 doc.addEventListener('click',event=>{
  if(!event.isTrusted)return;
  const btn=event.target?.closest?.('button');
  if(!btn||btn.disabled)return;
  let choice=null;
  if(btn.matches('.classic-count-btn[data-count]')||btn.id==='startClassic'){
   const total=btn.matches('.classic-count-btn[data-count]')
    ?Number(btn.dataset.count)
    :Number(doc.querySelector('.classic-count-btn.active')?.dataset.count||10);
   choice={mode:'classic',total,level:Number(doc.getElementById('classicLevel')?.value)};
  }else if(btn.id==='startSudden'||btn.id==='mathasMultiThreeLives'){
   choice={mode:btn.id==='startSudden'?'sudden':'three-lives',
    level:Number(doc.getElementById('suddenLevel')?.value)};
  }else if(btn.matches('#hardMenu .hard-sudden')){
   const level=Number(btn.closest('.hard-level-card')?.querySelector('h3')?.textContent.match(/NIV\s*([123])/i)?.[1]);
   choice={mode:btn.classList.contains('mathas-multi-hard-three-lives')?'hard-three-lives':'hard-sudden',
    level};
  }
  if(!choice||![1,2,3].includes(choice.level)
   ||(choice.mode==='classic'&&![4,10,20].includes(choice.total)))return;
  event.preventDefault();event.stopImmediatePropagation();
  const selected=[...doc.querySelectorAll('#multiplierPicker [data-mult].active')]
   .map(x=>Number(x.dataset.mult)).filter(x=>Number.isInteger(x)&&x>=2&&x<=9);
  const multipliers=choice.mode.startsWith('hard-')?[2,3,4,5,6,7,8,9]
   :selected.length?selected:Array.isArray(multiplierLock)?multiplierLock:[2,3,4,5,6,7,8,9];
  const method=doc.querySelector('input[name="carryMethod"]:checked')?.value||'top';
  const tensFirst=!!doc.getElementById('tensFirstToggle')?.checked;
  void certifiedClassic.start({...choice,multipliers,method,tensFirst});
 },true);
}
