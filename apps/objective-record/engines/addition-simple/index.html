 const data=await res.json();if(res.ok&&data.ok){lastXp=data;if(xpUiVersion===readVersion&&xpVisualPending===0){showEarnedXp(data.appXp);renderXpMeter(data.total,data.level,true)}return data}return null;
}
async function toggleXpDetails(){
 let panel=document.getElementById('xp-details');
 if(panel&&!panel.hidden){panel.hidden=true;return}
 if(!panel){panel=document.createElement('aside');panel.id='xp-details';document.body.append(panel)}
 panel.hidden=false;panel.textContent='Chargement des XP…';
 try{const data=await loadXp();if(!data){panel.textContent='XP indisponibles hors connexion.';return}
 const head=document.createElement('div');head.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px';
 const title=document.createElement('strong');title.textContent='XP acquis dans ce jeu : '+data.appXp+' · Connect N'+data.level+' ('+data.total+' XP au total)';
 const close=document.createElement('button');close.textContent='Fermer';close.onclick=()=>panel.hidden=true;head.append(title,close);
 const table=document.createElement('table'),owned=new Set(data.repeatXp?data.currentMilestones:data.milestones);
 for(const entry of xpRows()){const tr=document.createElement('tr'),name=document.createElement('td'),points=document.createElement('td');name.textContent=(owned.has(entry.key)?'✓ ':'○ ')+entry.label;points.textContent=(owned.has(entry.key)?'Acquis · ':'+')+entry.pts+' XP';tr.append(name,points);table.append(tr)}
 const hint=document.createElement('p');hint.style.cssText='font-size:12px;color:#c5e5f4';
 hint.textContent=data.repeatXp?'Parcours '+data.parcours+' : les récompenses peuvent être regagnées une fois sur ce parcours.':data.parcours>1?'Parcours '+data.parcours+' : XP historiques conservés, mais non regagnables.':'Chaque récompense se gagne une fois.';
 panel.replaceChildren(head,hint,table)
 }catch{panel.textContent='Impossible de charger les XP pour le moment.'}
}
// Nouvelle file pour le départ Connect à zéro : ne pas réémettre de résultats tests anciens.
const queueKey='ce-addition.pending.'+(session?.user?.id||'free')+'.v2';
const readQueue=()=>{try{const a=JSON.parse(localStorage.getItem(queueKey)||'[]');return Array.isArray(a)?a:[]}catch{return []}};
const saveQueue=q=>{if(q.length>1000)throw Error('File de synchronisation saturée : ne pas terminer de nouvelles parties avant reconnexion.');localStorage.setItem(queueKey,JSON.stringify(q))};
let draining=false;
function showSync(){const v=document.getElementById('ce-sync');if(v)v.textContent=mode==='connected'?(readQueue().length?'En attente : '+readQueue().length:(!navigator.onLine?'Hors ligne':'Synchronisé')):''}
async function drain(){
 if(draining||mode!=='connected'||!cloud)return;
 draining=true;
 try{
  let q=readQueue();
  let conflicts=0;
  while(q.length){
   const e=q[0],a=(await cloud.auth.getSession()).data.session;
   if(!a)break;
   if(e.expectedResetEpoch!==resetEpoch){q.shift();saveQueue(q);continue}
   e.expectedRevision=revision;
   const headers={apikey:KEY,authorization:'Bearer '+a.access_token,'content-type':'application/json'};
   let res,data;
   try{res=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify(e)});data=await res.json()}catch{break}
   if(res.ok&&data.ok){revision=data.revision;resetEpoch=data.resetEpoch??resetEpoch;q.shift();saveQueue(q);conflicts=0;if(data.xp&&Number.isFinite(Number(data.xp.appXp))){xpUiVersion++;if(data.xp.delta>0)queueXpGain(data.xp);else if(!xpVisualPending){showEarnedXp(data.xp.appXp);renderXpMeter(data.xp.total,data.xp.level,true)}}continue}
   if(data.error==='stale_reset_epoch'){q.shift();saveQueue(q);break}
   if(data.error==='revision_conflict'&&conflicts++<2){
    const v=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})}).then(r=>r.json()).catch(()=>null);
    if(!v?.ok)break;revision=v.revision;resetEpoch=v.resetEpoch??0;continue;
   }
   console.warn('Partie non envoyée',data.error);break;
  }
 }finally{draining=false;showSync()}
}
window.addEventListener('online',drain);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')drain()});
window.MathasPilotBridge={mode,openTeacherParcours:()=>{
 window.open('https://mr-tat.github.io/Mathas-Connect/index.html?portail=prof&profClass='+encodeURIComponent(classId),'_blank','noopener');
},completed:async item=>{
 if(mode!=='connected'||!cloud)return;
 const label=item.label||'',match=label.match(/(?:Niveau|NIV)\s*([123])/i);if(!match)return;
 const level=Number(match[1]),hard=/HARD/i.test(label),sudden=/Mort subite/i.test(label);
 const scoreText=String(item.score||'');const result=scoreText.match(/^(\d+)(?:\s*[/]\s*(\d+))?$/);if(!result)return;
 const score=Number(result[1]),total=result[2]?Number(result[2]):null;
 const hardChallenge=hard&&!sudden&&total===5;
 if(!sudden&&!hardChallenge&&![4,10,20].includes(total))return;
 const modeKey=hardChallenge?'hard-challenge':hard?'hard':sudden?'sudden':'classic';
 const points=hardChallenge?0:Math.max(0,Math.round(window.MathasPilotBridge.points(item)));
 const eventId=crypto.randomUUID();
 const body={action:'game-record',classId,appKey:APP,eventId,expectedRevision:revision,expectedResetEpoch:resetEpoch,mode:modeKey,level,score,total:hardChallenge?5:sudden?null:total,points};
 const awards=currentRewards();if(awards?.version===3)body.rewards=awards;
 const pending=readQueue();pending.push(body);saveQueue(pending);showSync();await drain();
},points:item=>{const m=String(item.score||'').match(/^(\d+)(?:\s*[/]\s*(\d+))?$/);if(!m)return 0;const hard=/HARD/i.test(item.label),sudden=/Mort subite/i.test(item.label),n=Number(m[1]),total=m[2]?Number(m[2]):0;const level=Number((String(item.label).match(/(?:Niveau|NIV)\s*([123])/i)||[])[1]||1);const ml=[1,1.2,1.4,1.6,1.8,2][hard?level+2:level-1],mf=sudden?1.6:total===20?1.6:total===10?1.3:1;let weighted=n;if(sudden){weighted=0;for(let i=0;i<n;i++)weighted+=Math.min(4,Math.pow(1.035,i))}return 5*ml*mf*weighted}};

if(mode==='connected'){
