 function renderConnectPreview(){
   const doc=frame.contentDocument;
   if(!doc||!xpPreviewMode)return;
   for(const [id,total] of [['startThreeLives',10],['startSudden',20]]){
     const meta=doc.querySelector('#'+id+' .score-mode-meta');
     if(!meta)continue;
     let line=meta.querySelector('.score-mode-detail');
     if(xpPreviewMode.value==='free'){if(line)line.remove();continue;}
     if(!line){
       line=doc.createElement('span');
       line.className='score-mode-detail';
       meta.appendChild(line);
     }
     line.textContent='Reste '+(xpPreviewMode.value==='zero'?0:total)+' XP';
   }
   // Barème natif Connect, par niveau : 4/4=22, 10=30+6 bonus,
   // 20=50+10 bonus. Simulation des droits encore disponibles.
   const classicFullXp={'4':22,'10':36,'20':60};
   // Menu mobile : agrandir la largeur utile des trois séries de calculs.
   // Préserver le gap, le padding et les proportions natifs de la rangée 4/10/20.
   
   doc.querySelectorAll('#menuScreen button.classic-count-btn[data-count]').forEach(button=>{
     // Le CSS natif peut imposer des retours à la ligne plus spécifiques.
     // Forçage visuel réservé à cet essai, sans changer le vrai jeu.
     for(const [name,value] of [
       ['box-sizing','border-box'],['display','flex'],['flex-direction','row'],
       ['align-items','center'],['justify-content','center'],
       ['white-space','nowrap'],['min-height','56px'],
       ['font-size','clamp(.66rem,2.1vw,1.125rem)'],['line-height','1.12'],
       ['padding',xpPreviewMode.value==='free'?'5px 4px 7px':'5px 4px 19px']
     ])button.style.setProperty(name,value,'important');
     const total=classicFullXp[button.getAttribute('data-count')];
     if(total===undefined)return;
     let line=button.querySelector('.classic-xp-remaining');
     if(xpPreviewMode.value==='free'){if(line)line.remove();return;}
     if(!line){
       line=doc.createElement('span');
       line.className='classic-xp-remaining';
       button.appendChild(line);
     }
     line.textContent='Reste '+(xpPreviewMode.value==='zero'?0:total)+' XP';
   });
 }
 if(xpPreviewMode?.addEventListener)xpPreviewMode.addEventListener('change',renderConnectPreview);
 if(frame?.addEventListener)frame.addEventListener('load',renderConnectPreview);
 function swap(text,from,to,label){
   const split=text.split(from);
   if(split.length!==2)throw Error('La version du moteur a changé : '+label);
   return split[0]+to+split[1];
 }

     "body.light-mode #gameScreen #threeLivesHud,body.light #gameScreen #threeLivesHud{background:linear-gradient(180deg,#f3e8ff,#dfd5f2)!important;border-color:#9874b7!important;box-shadow:0 3px 10px #32254b24!important}",
     "@media(max-width:1399px){html:not(.mathas-handheld-portrait) #gameScreen #threeLivesHud{position:static!important;left:auto!important;top:auto!important;transform:none!important;grid-column:1/-1!important;grid-row:2!important;justify-self:center!important;margin:1px auto 0!important;min-height:54px!important}}",
     "html.mathas-handheld-portrait #gameScreen #threeLivesHud{position:static!important;left:auto!important;top:auto!important;transform:none!important;grid-area:2/1/3/7!important;justify-self:center!important;margin:5px auto 0!important;min-height:46px!important;padding:3px 9px!important}",

     "@media(max-width:550px){",
     " #menuScreen .mode-card.sudden .score-mode-options{gap:7px!important}",
     " #menuScreen .mode-card.sudden .score-mode-options > button{min-height:112px!important;padding:10px 5px!important}",
     " #menuScreen .mode-card.sudden .score-mode-foot:not(.score-mode-bonus){font-size:.64rem!important}",
     " #menuScreen .mode-card.sudden .score-mode-detail{font-size:.64rem!important}",
     " #menuScreen .mode-card.sudden .score-mode-meta{width:100%!important;gap:5px!important;padding:6px 3px!important}",
     " #menuScreen .mode-card.sudden .score-mode-bonus{font-size:.67rem!important;padding:5px 5px!important;min-height:27px!important}",
     " #menuScreen .mode-card.sudden .score-mode-title-row .score-mode-name{font-size:.86rem!important}",
     " #gameScreen #threeLivesHud .demo-heart{width:38px;height:38px}",
     "}",

     " #gameScreen #threeLivesHud .demo-heart.breaking{animation:none}",
     " #threeLivesHud .demo-heart .left-half,#threeLivesHud .demo-heart .right-half{transition:none}",

     "}",
     "</style>",
   ].join('\n');
   game=swap(game,'</body>',visualCss+'</body>','styles de fin');

   game=swap(game,'<h3 class="mode-title">Mort subite</h3>','<h3 class="mode-title"><span class="score-mode-cup" aria-hidden="true">🏆</span> Objectif record</h3>','titre de la carte');
   game=swap(game,
     '<p class="mode-description">Deux additions à la fois. La première réponse fausse arrête immédiatement la partie.</p>',
     '<p class="mode-description">Deux façons de marquer un gros score.</p>',
     'description de la carte');
   game=swap(game,
     '<button class="btn btn-gold" id="startSudden" type="button">Lancer la mort subite</button>',

   game=swap(game,

     'emplacement des trois cœurs');

   // Les cœurs sont dans un cadre flottant au centre de la barre de session ;
   // pas de ligne supplémentaire sur PC, contrairement à l'ancienne grille 1/-1.
   // La session trois vies ne partage aucun record, bonus XP ou trophée avec la Mort subite.
   const helpers=[
     '  function demoHeartHtml(){',
     '    const whole=\'<svg class="whole" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42 C16 35 4 26 4 16 C4 9 9 5 15 5 C19 5 22 7 24 11 C26 7 29 5 33 5 C39 5 44 9 44 16 C44 26 32 35 24 42Z" fill="#ee4b63" stroke="#ad2b40" stroke-width="1.3"/><path d="M11 13 Q14 9 18 12" stroke="#ffb8c2" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>\';',

   game=swap(game,'  function startSession(mode){',helpers+'  function startSession(mode){','aides trois vies');
   game=swap(game,
     "mode==='sudden'?+suddenMaxDigits.value:+trainingMaxDigits.value",

   // Un calcul faux est immédiatement abandonné ; jamais de correction ni double pénalité.
   const threeLivesBranch=[
     "    if(session.mode==='three-lives'){",
