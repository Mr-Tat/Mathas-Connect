<!doctype html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="../../assets/brand/favicon.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math’as Connect — Objectif record</title>
<script>
// Déterminer le parcours natif avant le premier rendu : aucune apparition
// fugace de l'ancien bandeau Connect durant le chargement des modules.
(function(){
 const q=new URLSearchParams(location.search);
 const app=q.get('app')||'addition-simple';
 const native=app==='addition-simple'||app==='addition-multiple'||
  (app==='soustraction'&&q.get('class')==='4bf3400d-a315-4ea4-a2f3-afaca24dc9b9');
 if(native)document.documentElement.classList.add('mathas-native-connect-hud');
})();
</script>
<style>
:root{color-scheme:dark;--connect-bar-height:58px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font:14px/1.4 system-ui,sans-serif;background:#071e31;color:#f5f9ff}
main{display:flex;flex-direction:column;height:100dvh;min-height:0}
a{color:#bde6ff}
select,button{font:inherit;background:#234662;border:1px solid #829bb2;border-radius:8px;padding:6px 8px;color:inherit}
button{cursor:pointer}button:disabled{opacity:.5}
[hidden]{display:none!important}
#connect-bar{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 14px;background:linear-gradient(110deg,#102c46,#15384d);border-bottom:1px solid #5c91ad;box-shadow:0 6px 18px #0007;transition:transform .28s ease;min-height:54px}
#connect-bar.retracted{transform:translateY(calc(-100% - 9px));pointer-events:none}
/* L'attribut hidden doit primer sur le display:flex auteur, dès le premier rendu. */
#connect-bar[hidden],#bar-handle[hidden]{display:none!important}
#connect-bar .connect-ident{display:flex;align-items:center;gap:13px;flex:1 1 auto;min-width:0}
#connected-name-wrap{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;color:#d6f3ff}
#connected-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
#connected-dot{color:#79e3b2;flex:none}
#connect-xp-meter{display:flex;align-items:center;gap:10px;min-width:177px;background:#173d59;border:1px solid #486f86;border-radius:12px;padding:4px 9px}
#level-label{white-space:nowrap;font-size:11px;color:#ffe4a0}
#level{font-size:22px;color:#fff5cd;margin-left:3px}
#meter-progress{display:grid;gap:3px;min-width:75px;flex:1}
#level-xp{font-size:11px;color:#f9e2a4;white-space:nowrap;font-variant-numeric:tabular-nums}
#meter-track{background:#0c263a;border:1px solid #527893;height:9px;border-radius:99px;overflow:hidden}
#level-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9a336,#ffe18b);transition:width .6s ease}
#bar-actions{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
#bar-actions button,#bar-actions a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:34px;white-space:nowrap;border-radius:9px;border:1px solid #82a6be;padding:6px 10px;font-size:12px;font-weight:700;background:#245472;color:#f8fcff}
#bar-actions #xp-toggle{border-color:#caac63;background:#61491f;color:#ffedbd;box-sizing:border-box;display:inline-flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;width:177px;flex:0 0 177px;height:51px;min-height:51px;padding:6px 7px;font-size:11px;line-height:1.14;white-space:nowrap}
#xp-toggle-main{font-weight:850;font-variant-numeric:tabular-nums}
#xp-toggle-hint{font-size:9.5px;font-weight:650;opacity:.76}
@media(max-width:680px){#bar-actions #xp-toggle{width:158px;flex-basis:158px;font-size:10px}#xp-toggle-hint{font-size:9px}}
#bar-actions #bar-home{background:#2c435d}
#bar-actions button[aria-expanded="true"]{outline:2px solid #ffda75}
#bar-handle{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:1201;min-height:20px;padding:1px 16px 3px;border-radius:0 0 12px 12px;background:#1b4a68;color:#ffedae;border:1px solid #5789a5;border-top:0;font-size:11px;font-weight:800;box-shadow:0 4px 9px #0008}
#guest-home{position:fixed;top:10px;left:10px;z-index:1100;border:1px solid #81acc3;background:#123f5d;padding:8px 12px;border-radius:9px;color:#fff;text-decoration:none;font-weight:700}
/* Deux additions : profil et bouton XP intégrés dans le menu NATIF du jeu.
   Le bandeau Connect et sa poignée ne prennent plus aucune hauteur visible. */
html.mathas-native-connect-hud #connect-bar,
html.mathas-native-connect-hud #bar-handle{display:none!important}
html.mathas-native-connect-hud #xp-panel{
 top:12px;right:12px;max-height:calc(100dvh - 24px);z-index:1500
}
html.mathas-native-connect-hud #guest-home{display:none!important}

#status{position:fixed;z-index:1190;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(96vw,780px);padding:9px 14px;border:1px solid #96afbc;border-radius:10px;background:#132d45f0;box-shadow:0 6px 20px #0009;color:#ffe9bd;font-weight:650;text-align:center;pointer-events:none}
#status.status-error{border-color:#e9a765;background:#4c292af5}
#xp-panel,#challenge-panel{position:fixed;z-index:1200;top:calc(var(--connect-bar-height) + 5px);right:10px;max-width:calc(100vw - 20px);max-height:calc(100dvh - var(--connect-bar-height) - 20px);overflow:auto;border:1px solid #739bb3;border-radius:13px;background:#102c43f7;padding:13px;box-shadow:0 14px 35px #000a}
#xp-panel{width:min(500px,calc(100vw - 20px))}
#challenge-panel{width:min(780px,calc(100vw - 20px))}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.panel-heading>strong{font-size:15px;color:#ffdf98}
#xp-panel .xp-heading{gap:clamp(7px,2.2vw,18px)}
#xp-panel .xp-heading>strong{flex:1 1 auto;min-width:0;line-height:1.25}
#xp-heading-total{margin-left:auto;white-space:nowrap;color:#ffe3a0;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
#xp-heading-total strong{color:#ffdf98;font-size:14px}
#xp-panel .xp-heading .panel-close{flex:0 0 auto}
.panel-close{min-width:30px;font-size:17px}
#xp-table{width:100%;border-collapse:collapse;font-size:12px}
#xp-table td{padding:5px 3px;border-bottom:1px solid #30536b}
#xp-table td:last-child{text-align:right;white-space:nowrap}
#xp-table tr.is-earned{color:#9cedbd}
#certified-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#certified-tools label{display:grid;gap:4px;font-size:12px}
#certified-tools select{max-width:180px}
#certify{font-weight:700;min-height:36px}
#extended-certified[hidden]{display:none}
#notice{display:none}
@media(max-width:720px){
 #connect-bar{padding:5px 8px;gap:5px;flex-wrap:wrap}
 #connect-bar .connect-ident{gap:7px;min-width:0;flex:1 1 100%;justify-content:space-between}
 #connected-name-wrap{max-width:calc(100% - 171px)}
 #connect-xp-meter{min-width:160px;max-width:170px;padding:2px 6px}
 #bar-actions{width:100%;gap:5px;justify-content:flex-end}
 #bar-actions button,#bar-actions a{padding:4px 7px;min-height:30px;font-size:11px}
}
@media(prefers-reduced-motion:reduce){#connect-bar,#level-fill{transition:none!important}}
/* Même ambiance visuelle que le jeu natif, sans toucher aux preuves certifiées.
   Les gros calculs HARD restent accessibles via défilement horizontal. */
#extended-certified{
  box-sizing:border-box;display:flex;flex:1 1 auto;min-height:0;min-width:0;
  flex-direction:column;align-items:center;gap:12px;padding:clamp(12px,2.1vw,24px);
  overflow-y:auto;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 0%,#173b57 0%,#0d273e 54%,#091d31 100%);
}
#extended-certified h2{
  margin:4px auto 0;max-width:min(960px,100%);text-align:center;
  font-size:clamp(20px,2.7vw,30px);line-height:1.15;color:#ffe0a6;
}
#extended-status{
  box-sizing:border-box;max-width:min(960px,100%);width:max-content;
  padding:8px 14px;margin:0 auto;min-height:32px;text-align:center;
  border:1px solid #597b91;border-radius:12px;
  background:#142f46;color:#d9f6ec;font-size:clamp(12px,1.55vw,15px);
  font-weight:750;
}
#extended-grid{
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;
  gap:12px;width:100%;max-width:100%;min-width:0;
}
.extended-workspace{
  box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  gap:18px;width:100%;max-width:1200px;min-width:0;
}
.extended-calc-box{
  box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;
  min-width:0;max-width:900px;flex:1 1 auto;padding:12px 15px;
  border:1px solid #334155;border-radius:16px;background:#111b2c;
}
.extended-calc-label{
  margin:1px 0 8px;text-align:center;font:850 13px/1.2 system-ui;
  color:#a9bfd4;
}
.extended-grid-scroll{
  --extended-column-width:clamp(39px,4.4vw,54px);
  --extended-operator-width:34px;
  box-sizing:border-box;display:block;max-width:100%;width:100%;
  padding:8px 8px 14px;overflow-x:auto;
  scrollbar-color:#7da9c6 #0c2c44;
}
.extended-operations{
  display:grid;gap:4px;align-items:center;justify-content:center;
  width:max-content;max-width:none;margin:0 auto;
  font-size:clamp(21px,2.7vw,28px);
  font-variant-numeric:tabular-nums;
}
.extended-digit{
  display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  min-width:0;min-height:48px;padding:0;
  font-weight:850;font-family:inherit;color:#f2f8ff;
}
.extended-digit.extended-indicator{color:#edba76;opacity:.8;font-size:19px}
.extended-digit.extended-operator{color:#ffe0a6;font-size:30px;font-weight:900}
.extended-digit.extended-equals{color:#c8f6f0;font-size:24px;font-weight:900}
.extended-digit.extended-last-addend{min-height:52px}
.extended-result-bar{
  grid-column:1/-1;height:3px;margin:2px 0 4px;
  background:#94a3b8;border-radius:999px;
}
.extended-digit-input{
  box-sizing:border-box;width:100%;height:48px;min-width:0;padding:0;
  border-radius:10px;border:2px solid #64748b;
  background:#111827;color:#f8fafc;
  font:850 25px/1 system-ui;text-align:center;font-variant-numeric:tabular-nums;
}
.extended-digit-input.carry{
  width:69%;max-width:38px;height:32px;margin:auto;
  background:#111827;border-style:dashed;border-color:#d99a51;
  color:#fbbf24;font-size:17px;
}
.extended-digit-input:focus{outline:3px solid #ffdd77;outline-offset:2px}
.extended-instructions{
  margin:0;max-width:670px;padding:0 9px;color:#d3e7f4;
  font-size:clamp(12px,1.5vw,14px);line-height:1.4;text-align:center;
}
.extended-keypad{
  box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;align-content:center;justify-content:center;
  flex:0 0 220px;width:220px;max-width:100%;
  padding:10px;background:#111b2c;border:1px solid #334155;border-radius:14px;
}
.extended-keypad-title{
  grid-column:1/-1;margin:0 0 3px;text-align:center;
  color:#9fb7cc;font-weight:850;font-size:12px;
}
.extended-key-confirm{background:#0891b2!important;border-color:#06b6d4!important}
.extended-key{
  min-height:46px;padding:5px!important;font-size:20px;font-weight:800;
  background:linear-gradient(180deg,#266a91,#194a6e)!important;
  border:1px solid #78a7c6!important;border-radius:10px!important;
  box-shadow:0 3px 0 #0b253d;
}
.extended-actions{
  display:flex;gap:9px;justify-content:center;align-items:center;
  flex-wrap:wrap;box-sizing:border-box;max-width:100%;padding:8px 0 14px;
}
.extended-actions button{min-height:43px;padding:9px 14px;font-weight:750}
.extended-finished{
  max-width:600px;padding:22px 14px;text-align:center;
  font-size:clamp(17px,2.4vw,22px);color:#d8f5e1;
}
#extended-next[hidden]{display:none}

/* Mort subite : un seul calcul au centre, des commandes lisibles, aucun
   changement de questions/réponses ni de validation officielle. HARD conserve
   le défilement horizontal pour les opérations très longues. */
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]){
  gap:clamp(8px,1.5vw,15px);
  padding:clamp(10px,2vw,24px);
  background:radial-gradient(ellipse at top,#19405b 0%,#102a41 48%,#081e30 100%);
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) h2{
  margin:2px auto 0;
  color:#ffe6b8;font-size:clamp(24px,3.2vw,36px);
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-status{
  width:auto;max-width:min(800px,100%);padding:9px 15px;
  border-color:#9a825b;background:#27364a;color:#fff1d5;
  line-height:1.45;white-space:normal;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-instructions{
  max-width:760px;line-height:1.5;color:#d6e8f3;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-workspace{
  max-width:960px;gap:clamp(12px,2vw,22px);align-items:center;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-calc-box{
  max-width:760px;padding:clamp(10px,2vw,22px);
  border-color:#56758c;background:#10263c;
  box-shadow:0 10px 24px #0005;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-calc-label,
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-keypad-title{
  display:none;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-keypad{
  padding:12px;border-color:#56758c;background:#10263c;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-key{
  min-height:48px;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-actions{
  gap:12px;width:100%;padding:3px 0 12px;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-verify,
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-next{
  min-width:190px;min-height:48px;
  border-color:#e8c47a;background:#ad7624;color:#fff;
  font-size:15px;font-weight:850;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-exit{
  min-height:44px;background:#24435b;
}
#extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"])[data-phase="saving"] #extended-status{
  border-color:#d7ad60;color:#ffe7ac;
}
@media(max-width:520px){
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-status{
    font-size:13px;
  }
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-workspace{
    width:100%;gap:10px;
  }
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-keypad{
    width:min(320px,100%);grid-template-columns:repeat(3,minmax(0,1fr));
  }
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) .extended-actions{
    gap:9px;
  }
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-verify,
  #extended-certified:is([data-mode="sudden"],[data-mode="hard-sudden"]) #extended-next{
    width:min(320px,100%);
  }
}
@media(max-width:860px){
  .extended-workspace{flex-direction:column;gap:12px}
  .extended-calc-box{flex:0 1 auto;width:100%;max-width:100%}
  .extended-keypad{flex:0 0 auto;width:min(220px,100%)}
}
@media(max-width:520px){
  .extended-calc-box{padding:10px 5px}
  .extended-grid-scroll{
    --extended-column-width:37px;--extended-operator-width:25px;
    padding:12px 8px;
  }
  .extended-digit{min-height:40px;font-size:21px}
  .extended-digit.extended-last-addend{min-height:44px}
  .extended-digit-input{height:41px;font-size:22px}
  .extended-digit-input.carry{height:28px;font-size:15px}
  .extended-operations{gap:2px}
  .extended-keypad{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .extended-actions button{font-size:12px}
}

#notice{padding:7px 14px;background:#24334b;color:#ffdaa2;font-size:12px}
#gameFrame{width:100%;flex:1;min-height:250px;border:0;background:#071e31}#gameFrame[hidden]{display:none}
@media(max-width:600px){header{gap:7px;padding:7px 10px}header strong{font-size:14px}#progress{gap:9px;font-size:12px;padding:6px 10px}#progress strong{font-size:14px}select{max-width:180px}}
</style>
</head>
<body><main>
<header id="connect-bar" hidden aria-label="Profil Math’as Connect">
 <div class="connect-ident">
  <span id="connected-name-wrap"><span id="connected-dot">●</span><span id="connected-avatar" aria-hidden="true"></span><strong id="connected-name">Élève</strong></span>
  <div id="connect-xp-meter" aria-label="Progression Connect">
   <span id="level-label">Niveau <strong id="level">—</strong></span>
   <div id="meter-progress"><small id="level-xp">— / — XP</small>
    <div id="meter-track" role="progressbar" aria-label="Progression XP dans le niveau" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><i id="level-fill"></i></div>
   </div>
  </div>
 </div>
 <nav id="bar-actions" aria-label="Commandes Connect">
  <button id="xp-toggle" type="button" aria-controls="xp-panel" aria-expanded="false" title="Voir les XP gagnés et à gagner"><span id="xp-toggle-main">✨ XP à récupérer</span><span id="xp-toggle-hint">Voir le détail ›</span></button>
  <a id="bar-home" href="../../hub.html">⌂ Accueil</a>
 </nav>
</header>
<button id="bar-handle" type="button" hidden aria-label="Afficher la barre Connect">⌄ Profil Connect</button>
<a id="guest-home" href="../../hub.html">↩ Retour au HUB</a>
<div id="status" role="status" aria-live="polite" hidden>Vérification de la connexion…</div>
<section id="xp-panel" hidden aria-label="Relevé des XP officiels">
 <div class="panel-heading xp-heading"><strong>✨ XP acquis et à gagner</strong><span id="xp-heading-total" title="Total des XP acquis dans ce jeu">Total : <strong id="app-xp">—</strong> XP</span><button id="xp-close" class="panel-close" type="button" aria-label="Fermer les XP">×</button></div>
 <table id="xp-table" aria-label="Récompenses XP"><tbody id="xp-rows"><tr><td>Ouvre ce relevé pour consulter tes XP.</td></tr></tbody></table>
 <p><button id="refresh" type="button" disabled>↻ Actualiser le profil</button></p>
</section>
<section id="challenge-panel" hidden aria-label="Démarrer une série certifiée">
 <div class="panel-heading"><strong>✏️ Choisir un défi Connect</strong><button id="challenge-close" class="panel-close" type="button" aria-label="Fermer les réglages">×</button></div>
 <label for="app">Calcul écrit :
 <select id="app"><option value="addition-simple">Addition simple</option><option value="addition-multiple">Addition multiple</option>
 <option value="soustraction">Soustraction écrite</option><option value="multiplication">Multiplication simple</option><option value="melange">Mélange de calculs</option></select></label>
 <section id="certified-tools" hidden aria-label="Épreuve arithmétique vérifiée">
<label for="certified-mode">Mode
<select id="certified-mode">
<option value="classic">➕ Classique</option>
<option value="three-lives">❤️ 3 vies</option>
<option value="sudden">💀 Mort subite</option>
<option value="hard-three-lives">🔥 HARD · 3 vies</option>
<option value="hard-sudden">🔥 HARD · Mort subite</option>
</select></label>
<label for="certified-level">Niveau
<select id="certified-level"><option value="1">1 · 3 chiffres</option><option value="2">2 · 5 chiffres</option><option value="3">3 · 7 chiffres</option></select></label>
<label for="certified-total" id="certified-count-label">Série
<select id="certified-total"><option value="4">4 calculs</option><option value="10">10 calculs</option><option value="20">20 calculs</option></select></label>
<button id="certify" type="button" disabled>🔐 Lancer une série vérifiée par le serveur</button>

</section>
 <p id="challenge-hint" style="font-size:12px;color:#c6e0ec">Seules les séries validées par le serveur enregistrent les XP officiels.</p>
</section>
<div id="notice" hidden></div>
<section id="extended-certified" hidden aria-label="Calcul écrit certifié">
<h2 id="extended-title">Défi certifié</h2>
<p id="extended-status" role="status" aria-live="polite"></p>
<div id="extended-grid"></div>
<div class="extended-actions">
<button type="button" id="extended-verify">✓ Valider ce calcul</button>
<button type="button" id="extended-next" hidden>Calcul suivant</button>
<button type="button" id="extended-exit">Retour au jeu</button>
</div>
</section>
<iframe id="gameFrame" hidden title="Jeu Objectif record" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</main><script type="module" src="./eleve.mjs?v=20261107-profile-avatar-v1"></script></body></html>
