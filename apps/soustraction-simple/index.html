const threshold=l=>l<7?l*50:300+(l-6)*100;

const levelAt=total=>total<300?1+Math.floor(total/50):7+Math.floor((total-300)/100);
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const reducedMotion=()=>false; // Animations du lanceur toujours actives
function renderXpMeter(total,level,instant=false){
 const value=Math.max(0,Math.round(Number(total)||0));
 const actual=Number.isSafeInteger(level)&&level>=1?level:levelAt(value);
 const start=threshold(actual-1),end=threshold(actual),width=end-start;

 if(!fill||!amount||!number||!track||!card)return;
 number.textContent=String(actual);
 amount.textContent=earned+' / '+width+' XP';
 fill.style.transitionDuration=instant||reducedMotion()?'0ms':'690ms';
 fill.style.transform='scaleX('+(width?earned/width:0)+')';
 track.setAttribute('aria-valuenow',String(earned));

 card.title='Niveau '+actual+' · '+value+' XP au total · '+earned+' / '+width+' XP dans ce niveau';

async function animateXpGain(xp){
 const total=Number(xp.total),delta=Number(xp.delta),appXp=Number(xp.appXp);
 if(!Number.isFinite(total)||!Number.isFinite(delta)||delta<=0)return;
 const start=Math.max(0,total-delta),startLevel=levelAt(start),endLevel=levelAt(total);
 const finish=()=>{showEarnedXp(appXp);renderXpMeter(total,endLevel,true);bumpXpMeter()};
 if(document.hidden){finish();return}
 // Le vol des XP est volontairement toujours activé, même si l'OS réduit les mouvements.
 renderXpMeter(start,startLevel,true);
 const el=xpElement();
 el.hidden=false;
 el.replaceChildren();
 const amount=document.createElement('strong');amount.textContent='+'+delta+' XP';
 const text=document.createElement('div');text.textContent='Bravo ! Tes XP rejoignent ta progression.';
 el.append(amount,text);
 if(endLevel>startLevel){
  const burst=document.createElement('div');
  burst.id='xp-levelburst';burst.textContent='✦ Niveau '+endLevel+' atteint ! ✦';el.append(burst);
 }
 el.classList.remove('open');
 void el.offsetWidth;
 el.classList.add('open');
 await pause(830);
 const target=document.getElementById('ce-xp-meter');
 if(target&&el.animate&&!document.hidden){
  const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();
  const dx=b.left+b.width/2-(a.left+a.width/2);
  const dy=b.top+b.height/2-(a.top+a.height/2);
  try{
   const movement=el.animate([
     {transform:'translate(-50%, 0) scale(1)',opacity:1},
     {transform:'translate(calc(-50% + '+dx+'px), '+dy+'px) scale(.16)',opacity:0}
   ],{duration:550,easing:'cubic-bezier(.4,0,.7,1)',fill:'forwards'});
   await movement.finished;
   movement.cancel();
  }catch{}
 }
 el.classList.remove('open');
 el.hidden=true;
 // La jauge monte APRES l'arrivée du pop-up, y compris au changement de niveau.
 const steps=Math.min(3,Math.max(0,endLevel-startLevel));
 if(endLevel-startLevel>3){finish();return}
 for(let i=0;i<steps;i++){
  const lvl=startLevel+i;
  renderXpMeter(threshold(lvl),lvl);
  await pause(740);
  renderXpMeter(threshold(lvl),lvl+1,true);
  bumpXpMeter();
  await pause(170);
 }
 renderXpMeter(total,endLevel);
 showEarnedXp(appXp);
 await pause(730);
 bumpXpMeter();
}
function queueXpGain(xp){
 xpVisualPending++;
 xpVisualQueue=xpVisualQueue.then(()=>animateXpGain(xp)).catch(error=>{
  console.warn('Animation XP interrompue',error);
  showEarnedXp(xp.appXp);
  renderXpMeter(xp.total,xp.level,true);
 }).finally(()=>{xpVisualPending--});
}

// Nouvelle file pour le départ Connect à zéro : ne pas réémettre de résultats tests anciens.
const queueKey='ce-soustraction.pending.'+classId+'.'+(session?.user?.id||'free')+'.v3';
const readQueue=()=>{const raw=localStorage.getItem(queueKey);if(raw===null)return [];const items=JSON.parse(raw);if(!Array.isArray(items))throw Error('local_queue_corrupt');return items};
const saveQueue=q=>{
 if(q.length>1000)throw Error('File de synchronisation saturée : ne pas terminer de nouvelles parties avant reconnexion.');
 // Refuser d'écraser une file illisible : elle peut contenir les seuls résultats non synchronisés.

};
// Un nouveau parcours ne reprend jamais un résultat ancien. Archive avant retrait.
const staleKey=queueKey+'.previous-parcours.v1';
const staleQueue=()=>{const raw=localStorage.getItem(staleKey);if(!raw)return [];const q=JSON.parse(raw);if(!Array.isArray(q))throw Error('Archives invalides');return q};
function removeQueuedEvent(eventId){
 // Relecture APRES la réponse réseau : une autre partie a pu être ajoutée entre-temps.
 const pending=readQueue(),remaining=pending.filter(x=>x.eventId!==eventId);
 if(remaining.length!==pending.length)saveQueue(remaining);
}
function archiveOldEvent(event){

 if(past.length>=1000)throw Error('Archives pleines');
 if(!past.some(x=>x.eventId===event.eventId)){
  past.push({...event,archivedAt:new Date().toISOString(),reason:'reset-epoch-changed'});
  localStorage.setItem(staleKey,JSON.stringify(past));
 }
 removeQueuedEvent(event.eventId);
}
function staleCount(){try{return staleQueue().length}catch{return 1}}

async function drain(){

  catch{syncWarning='Ancienne file locale illisible : prévenir le professeur.'}

 }
 if(draining||mode!=='connected'||!cloud)return;

 try{
  let q=readQueue();
  let conflicts=0;
  while(q.length){
   q=readQueue();if(!q.length)break;
   const e=q[0],a=(await cloud.auth.getSession()).data.session;
   if(!a){syncWarning='Session interrompue : résultats conservés sur cet appareil.';break;}
   if(e.expectedResetEpoch!==resetEpoch){
    archiveOldEvent(e);q=readQueue();syncWarning='Ancienne partie archivée : préviens le professeur.';continue
   }
   e.expectedRevision=revision;
   const headers={apikey:KEY,authorization:'Bearer '+a.access_token,'content-type':'application/json'};
   let res,data;
   try{res=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify(e)});data=await res.json()}catch{syncWarning='Connexion indisponible : résultats en attente sur cet appareil.';break}
   if(res.ok&&data.ok){revision=data.revision;resetEpoch=data.resetEpoch??resetEpoch;removeQueuedEvent(e.eventId);q=readQueue();syncWarning='';conflicts=0;if(data.xp&&Number.isFinite(Number(data.xp.appXp))){xpUiVersion++;if(data.xp.delta>0)queueXpGain(data.xp);else if(!xpVisualPending){showEarnedXp(data.xp.appXp);renderXpMeter(data.xp.total,data.xp.level,true)}}continue}
   if(data.error==='stale_reset_epoch'){
    const latest=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})}).then(r=>r.ok?r.json():null).catch(()=>null);
    if(!latest?.ok||latest.resetEpoch===resetEpoch){syncWarning='Parcours modifié : résultat conservé. Préviens le professeur.';break}
    revision=latest.revision;resetEpoch=latest.resetEpoch;continue
   }
   if(data.error==='revision_conflict'&&conflicts++<2){
    const v=await fetch(URL+'/functions/v1/connect-results',{method:'POST',headers,body:JSON.stringify({action:'student-load',classId,appKey:APP})}).then(r=>r.json()).catch(()=>null);
    if(!v?.ok)break;revision=v.revision;resetEpoch=v.resetEpoch??0;continue;
   }
   syncWarning='Synchronisation en attente : réessaie avec une connexion stable.';console.warn('Partie non envoyée',data.error);break;
  }
 }catch(error){syncWarning='Synchronisation interrompue : résultats en attente sur cet appareil.';console.warn('Synchronisation interrompue',error)}finally{draining=false;showSync()}
}
window.addEventListener('online',()=>{syncWarning='';showSync();drain()});

window.MathasPilotBridge={mode,openTeacherParcours:()=>{
 window.open('https://mr-tat.github.io/Mathas-Connect/index.html?portail=prof&profClass='+encodeURIComponent(classId),'_blank','noopener');
},completed:(item,options={})=>{
 // Pas de résultats déclarés par le navigateur en mode scolaire.
 if(mode==='connected')return null;
 if(!cloud)return;
 const label=item.label||'',match=label.match(/(?:Niveau|NIV|Hard)\s*([123])/i);if(!match)return;
 const level=Number(match[1]),hard=/HARD/i.test(label),sudden=/Mort subite/i.test(label);
 const scoreText=String(item.score||'');const result=scoreText.match(/^(\d+)(?:\s*[/]\s*(\d+))?$/);if(!result)return;
 const score=Number(result[1]),total=result[2]?Number(result[2]):null;
 const hardChallenge=hard&&!sudden&&total===5;
 if(!sudden&&!hardChallenge&&![4,10,20].includes(total))return;
 const modeKey=hardChallenge?'hard-challenge':hard?'hard':sudden?'sudden':'classic';
 const points=hardChallenge?0:Math.max(0,Math.round(window.MathasPilotBridge.points(item)));
 const eventId=crypto.randomUUID();
 const body={action:'game-record',classId,appKey:APP,eventId,expectedRevision:revision,expectedResetEpoch:resetEpoch,mode:modeKey,level,score,total:hardChallenge?5:sudden?null:total,points,...(sudden&&!hard?{method:item.method==='takeTop'?'takeTop':'addBottom'}:{})};
 try{const pending=readQueue();pending.push(body);saveQueue(pending);syncWarning='';showSync();consent?.offer(eventId);if(!options.defer){const awards=currentRewards();if(awards?.version===3){body.rewards=awards;saveQueue(pending)}void drain()}return eventId}
 catch(error){syncWarning='ATTENTION : sauvegarde locale impossible. Préviens ton professeur.';showSync();console.error('Résultat non mis en attente',error);return null}
},finalize:eventId=>{
 const pending=readQueue(),event=pending.find(x=>x.eventId===eventId);
 if(event){const awards=currentRewards();if(awards?.version===3)event.rewards=awards;try{saveQueue(pending)}catch(error){console.error('Récompenses en attente non enregistrées',error)}}
 void drain();
},points:item=>{const m=String(item.score||'').match(/^(\d+)(?:\s*[/]\s*(\d+))?$/);if(!m)return 0;const hard=/HARD/i.test(item.label),sudden=/Mort subite/i.test(item.label),n=Number(m[1]),total=m[2]?Number(m[2]):0;const level=Number((String(item.label).match(/(?:Niveau|NIV|Hard)\s*([123])/i)||[])[1]||1);const ml=[1,1.2,1.4,1.6,1.8,2][hard?level+2:level-1],mf=sudden?1.6:total===20?1.6:total===10?1.3:1;let weighted=n;if(sudden){weighted=0;for(let i=0;i<n;i++)weighted+=Math.min(4,Math.pow(1.035,i))}return 5*ml*mf*weighted}};
// Dernière chance sans requête réseau : enrichir les événements durables avec les trophées
// que le moteur a déjà enregistrés, même si l'élève ferme avant le délai de 750 ms.
window.addEventListener('pagehide',()=>{
 if(mode!=='connected')return;
 try{
  const awards=currentRewards();
  if(awards?.version!==3)return;
  const pending=readQueue();
  let changed=false;
  for(const event of pending)if(event.expectedResetEpoch===resetEpoch){
   event.rewards=awards;changed=true;
  }
  if(changed)saveQueue(pending);
 }catch(error){console.warn('Récompenses locales non finalisées',error)}
});
