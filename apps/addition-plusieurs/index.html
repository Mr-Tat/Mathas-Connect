<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math'as · Addition de plusieurs nombres · laboratoire</title><style>html,body{margin:0;width:100%;height:100%;background:#0c2235;color:white;font-family:system-ui}main{height:100dvh;display:flex;flex-direction:column}.notice{padding:7px 12px;background:#173956;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}iframe{flex:1;width:100%;border:0;min-height:0}a{color:#a3ebff}button{background:#225477;color:white;border:1px solid #739cba;border-radius:6px;padding:5px 9px;cursor:pointer}output{font-size:12px;color:#b0ebc1}</style></head><body><main><div class="notice"><strong>Laboratoire · Addition de plusieurs nombres</strong><span>Mode libre seulement — aucun XP Connect ni envoi serveur</span><button id="audit" type="button">Événements : 0</button><output id="result" aria-live="polite"></output><a href="../../">Retour au HUB</a></div><iframe id="game" title="Addition de plusieurs nombres" allow="fullscreen"></iframe></main><script type="module">
import {normalizeCompletion} from './completion-contract.mjs';
import {CONNECT_WRITE_READY} from './connect-pilot.mjs';
import {createLocalLab} from './local-lab.mjs';
(async()=>{const frame=document.getElementById('game'),output=document.getElementById('result'),recorded=[];
 const simulate=new URLSearchParams(location.search).get('simulation')==='1';
 const lab=simulate?createLocalLab({storage:sessionStorage,onStatus:(status,reply)=>{if(status==='saved'&&reply?.xp)output.textContent='Simulation : '+reply.xp.appXp+' XP';}}):null;
 window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='mathas-addition-plusieurs-audit-v1')return;const item={label:String(e.data.label).slice(0,120),score:String(e.data.score).slice(0,30),rulerUsed:e.data.rulerUsed===true};if(!/^(Calculs|Mort subite|HARD)/i.test(item.label))return;const normalized=normalizeCompletion(item);if(!normalized)return;
// Le branchement Connect restera explicitement interdit jusqu'à validation du serveur de production.
if(CONNECT_WRITE_READY)throw new Error('Connect pilot activation requires reviewed wiring');
recorded.push(normalized);output.textContent=item.label+' : '+item.score;if(lab){lab.completed(item);void lab.flush();}document.getElementById('audit').textContent='Événements : '+recorded.length;});
 document.getElementById('audit').addEventListener('click',()=>alert(recorded.length?recorded.map((x,i)=>(i+1)+'. '+x.label+' = '+x.score).join('\n'):'Aucun événement final enregistré pour cette session.'));
 try{const r=await fetch('./game-original.html');if(!r.ok)throw Error('Jeu indisponible');let game=await r.text();if(!game.includes('window.__setLastWork=function'))throw Error('Pont natif introuvable');game=game.replace('</body>','<script src="./audit-bridge.js"></'+'script></body>');frame.srcdoc=game;}catch(e){output.textContent='Erreur : '+e.message}
})();
</script></body></html>
