<!doctype html><html lang="fr"><head>
<link rel="icon" type="image/png" href="../../assets/brand/favicon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Addition multiple — Laboratoire | Math’as Connect</title><style>html,body{margin:0;width:100%;height:100%;background:#0c2235;color:white;font-family:system-ui}main{height:100dvh;display:flex;flex-direction:column}.notice{padding:7px 12px;background:#173956;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}iframe{flex:1;width:100%;border:0;min-height:0}a{color:#a3ebff}button{background:#225477;color:white;border:1px solid #739cba;border-radius:6px;padding:5px 9px;cursor:pointer}output{font-size:12px;color:#b0ebc1}.xp-meter{display:flex;align-items:center;gap:7px;min-width:170px;font-size:11px;font-weight:700}.xp-track{width:100px;height:11px;border-radius:10px;background:#667d8d;overflow:hidden;border:1px solid #a2c3d0}.xp-fill{width:0;height:100%;display:block;background:#1A4675;transition:width .35s ease}.xp-level{white-space:nowrap;color:#ffd66a}.xp-total{white-space:nowrap}</style></head><body><main><div class="notice"><strong>Laboratoire · Addition de plusieurs nombres</strong><span id="mode-note">Mode libre seulement — aucun XP Connect ni envoi serveur</span><button id="audit" type="button">Événements : 0</button><div class="xp-meter" aria-label="Progression XP"><span class="xp-level" id="xp-level">Niveau 1</span><div class="xp-track" id="xp-track"><i id="xp-fill" class="xp-fill"></i></div><span id="xp-total" class="xp-total">0 XP</span></div><output id="result" aria-live="polite"></output><a href="../../">Retour au HUB</a></div><iframe id="game" title="Addition de plusieurs nombres" allow="fullscreen"></iframe></main><script type="module">
import {normalizeCompletion} from './completion-contract.mjs';
import {createProjectionConsent} from '../../projection-consent.mjs';
import {createLocalLab} from './local-lab.mjs';
import {buildConnectPilot,CONNECT_WRITE_READY as writeReady} from './connect-pilot.mjs';
import {createEdgePost} from './edge-transport.mjs';
import {createAuthenticatedHost,CONNECT_URL,CONNECT_APP} from './connect-host.mjs';
import {hydrateNativeRecords} from './connect-hydration.mjs';
(async()=>{const frame=document.getElementById('game'),output=document.getElementById('result'),recorded=[];
 // No Connect credentials are read until the backend has been validated and enabled.
 const launch=new URLSearchParams(location.search);
 const simulate=launch.get('simulation')==='1';
 const modeNote=document.getElementById('mode-note');
 if(simulate)modeNote.textContent='Laboratoire · simulation seulement — aucun envoi Supabase';
 let connected=null,host=null,consent=null;
 let xpAnimationQueue=Promise.resolve();
 // Match existing integrated games: class launch + approved anonymous student
 // (or the separate teacher player session). Explicit free mode never queries.
 const classId=launch.get('class')||'';
 const teacherPlayer=launch.get('joueur')==='prof';
 const free=!teacherPlayer&&localStorage.getItem('mathas.connect.mode-libre.v1')==='1';
 if(writeReady&&classId&&!free){
  try{
   const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.95.0');
   host=await createAuthenticatedHost({classId,teacherPlayer,createClient});
   consent=createProjectionConsent({classId,appKey:'addition-ecrite-multiple',studentKey:host.studentId,getToken:host.getToken});
   const post=createEdgePost({endpoint:host.endpoint,apikey:host.apikey,getToken:host.getToken});
   const candidate=buildConnectPilot({storage:localStorage,classId:host.classId,studentId:host.studentId,post,onStatus:(status,reply)=>{
     if(status==='pending'&&reply?.eventId)consent?.offer(reply.eventId);
     if(status==='saved'&&reply?.xp){
       output.textContent='Connect : '+reply.xp.appXp+' XP';
       confirmXp(reply.xp);
     }else if(status==='quarantined')output.textContent='Ancien parcours : '+reply.count+' résultat(s) hors ligne conservé(s) à part après la remise à zéro.';
     else if(status==='offline'||status==='conflict')output.textContent='Connect : résultat en attente ('+status+')';
   }});
   const loaded=await host.load();
   if(loaded?.ok!==true||!candidate.initialize(loaded.revision,loaded.resetEpoch))throw Error('connect_load_failed');
   connected=candidate;
   // No polling: when classroom Wi-Fi returns, retry queued results automatically.
   // The queue remains durable until the server confirms each event.
   window.addEventListener('online',()=>{void connected?.retry()});
   const hydrated=hydrateNativeRecords({storage:localStorage,
     scope:'connect.'+host.classId.toLowerCase()+'.'+host.studentId.toLowerCase(),
     state:loaded.state,pending:candidate.pending()});
   if(!hydrated)output.textContent='Connect : sauvegardes locales en attente de synchronisation';
   try{showXpMeter(await host.readXp())}catch{output.textContent='Connect : lecture XP momentanément indisponible'}
   void connected.retry();
   modeNote.textContent='Mode connecté — résultats et XP sauvegardés côté serveur';
  }catch(error){
   // Fail closed: a missing/revoked session, wrong class or unavailable
   // backend must NOT silently launch an unsaved game as if connected.
   connected=null;host=null;
   modeNote.textContent='Connexion indisponible — aucun résultat enregistré';
   output.textContent='Connexion Connect impossible ou non autorisée. Jeu non lancé : vérifiez votre session et votre classe.';
   console.warn('Addition plusieurs : connexion non disponible',error?.message||'unknown');
   return;
  }
 }
 const lab=simulate?createLocalLab({storage:sessionStorage,onStatus:(status,reply)=>{
  if(status==='saved'&&reply?.xp){
    output.textContent='Simulation : '+reply.xp.appXp+' XP';
    confirmXp(reply.xp);
  }else if(status==='conflict'||status==='offline'){
    output.textContent='Simulation : résultat en attente ('+status+')';
  }
}}):null;
 function showXpMeter(xp){
   const total=Number(xp?.total);
   if(!Number.isFinite(total)||total<0)return;
   const level=total<300?Math.floor(total/50)+1:Math.floor((total-300)/100)+7;
   const floor=level<=6?(level-1)*50:300+(level-7)*100;
   const span=level<=6?50:100;
   document.getElementById('xp-level').textContent='Niveau '+level;
   document.getElementById('xp-total').textContent=Math.floor(total)+' XP';
   document.getElementById('xp-fill').style.width=Math.min(100,Math.max(0,100*(total-floor)/span))+'%';
 }
 function confirmXp(xp){
   const delta=Number(xp?.delta);
   // XP animations are serialized: a later result can never roll the bar backward.
   xpAnimationQueue=xpAnimationQueue.catch(()=>{}).then(()=>delta>0?animateXp(delta):undefined)
     .then(()=>showXpMeter(xp));
 }
 function animateXp(delta){
   // Toujours montrer le vol des XP, même avec prefers-reduced-motion.
   const start=document.getElementById('game').getBoundingClientRect();
   const end=document.getElementById('xp-track').getBoundingClientRect();
   const particle=document.createElement('span');
   particle.textContent='+'+delta+' XP';particle.setAttribute('aria-hidden','true');
   Object.assign(particle.style,{position:'fixed',left:Math.max(10,start.left+start.width/2)+'px',top:Math.max(55,start.top+start.height/2)+'px',zIndex:'9999',background:'#f5cd53',color:'#132536',padding:'9px 14px',fontWeight:'900',borderRadius:'24px',pointerEvents:'none',boxShadow:'0 4px 18px #0007'});
   document.body.append(particle);
   const dx=(end.left+end.width/2)-(start.left+start.width/2),dy=(end.top+end.height/2)-(start.top+start.height/2);
   const move=particle.animate([{transform:'translate(-50%,-50%) scale(.8)',opacity:0},{offset:.2,transform:'translate(-50%,-75%) scale(1.3)',opacity:1},{offset:.55,transform:'translate(-50%,-95%) scale(1.3)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.3)',opacity:0}],{duration:1550,easing:'ease-in-out'});
   return move.finished.catch(()=>{}).finally(()=>particle.remove());
 }
 window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='mathas-addition-plusieurs-audit-v1')return;const item={label:String(e.data.label).slice(0,120),score:String(e.data.score).slice(0,30),rulerUsed:e.data.rulerUsed===true,rewards:e.data.rewards};if(!/^(Calculs|Mort subite|HARD)/i.test(item.label))return;const normalized=normalizeCompletion(item);if(!normalized)return;
// Le branchement Connect restera explicitement interdit jusqu'à validation du serveur de production.
if(writeReady&&host&&!connected)throw new Error('Connect host not initialized');
recorded.push(normalized);output.textContent=item.label+' : '+item.score;if(lab){lab.completed(item);void lab.flush();}if(connected)connected.completed(item);document.getElementById('audit').textContent='Événements : '+recorded.length;});
 document.getElementById('audit').addEventListener('click',()=>alert(recorded.length?recorded.map((x,i)=>(i+1)+'. '+x.mode+' · niveau '+x.level+' = '+x.score+(x.total?'/'+x.total:'')).join('\n'):'Aucun événement final enregistré pour cette session.'));
 try{
   const [r,storageFile]=await Promise.all([fetch('./game-original.html'),fetch('./storage-scope.js')]);
   if(!r.ok||!storageFile.ok)throw Error('Moteur ou isolation des scores indisponible');
   let game=await r.text(),storageCode=await storageFile.text();
   if(!game.includes('window.__setLastWork=function')||!game.includes('<head>')||!storageCode.includes('__mathasGameStorageScope'))throw Error('Pont de résultats ou isolation introuvable');
   const scope=connected?'connect.'+host.classId.toLowerCase()+'.'+host.studentId.toLowerCase():(simulate?'simulation':'libre');
   if(!/^[a-z0-9.-]{1,120}$/.test(scope))throw Error('identité du jeu non valide');
   frame.setAttribute('data-mathas-storage-scope',scope);
   game=game.replace('<head>','<head><script>'+storageCode+'</'+'script>');
   game=game.replace('</body>','<script src="./audit-bridge.js"></'+'script></body>');
   // Contrôleur collectif optionnel, distinct de l'audit des scores et trophées.
   let collective=null;
   if(connected&&host&&!simulate){
    try{
     const response=await fetch('./collective-native-bridge.js?v=20261112-guided-v1');
     if(!response.ok)throw Error('pont natif guidé indisponible');
     const source=await response.text();
     const marker="primaryBtn.addEventListener('click',handlePrimary);";
     if(game.split(marker).length!==2)throw Error('moteur natif non compatible avec le guidé');
     const hook=source+'\\nconst mathasNativeHandlePrimary=handlePrimary;'
      +'\\nhandlePrimary=function(...args){if(window.MathasGuidedBridge?.isCollectiveActive()&&phase==="review"){window.MathasGuidedBridge.onContinue?.();return}return mathasNativeHandlePrimary(...args)};'
      +'\\nprimaryBtn.addEventListener("click",handlePrimary);';
     game=game.replace(marker,hook);
     const {createAdditionMultipleCollective}=await import('./collective-ui.mjs?v=20261112-guided-v1');
     const labels={
      '8fe170fa-9e8f-4e80-885a-b0ba68026f64':'Observation',
      '71f5f4a5-3f25-4ec7-ac29-c33d2e6b395e':'Phase 1',
      '1b021ed9-4846-4203-9c7b-4b5fa8d7adab':'Phase 2 A',
      '0d8ba828-59cc-468b-a4b8-7b2a1af10b88':'Phase 2 B',
      'a9195199-0a28-4e86-99ce-47b36dd6e646':'2 ECO',
      '4bf3400d-a315-4ea4-a2f3-afaca24dc9b9':'TEST'
     };
     let closeToken=null;
     collective=createAdditionMultipleCollective({
      iframe:frame,teacher:teacherPlayer,classId:host.classId,
      classLabel:labels[host.classId]||'ID '+host.classId.slice(0,8),
      studentId:teacherPlayer?'':host.studentId,
      storage:(()=>{try{return sessionStorage}catch{return null}})(),
      call:async(action,payload={})=>{
       closeToken=await host.getToken();
       const response=await fetch(CONNECT_URL+'/functions/v1/connect-guided-written',{
        method:'POST',headers:{apikey:host.apikey,authorization:'Bearer '+closeToken,'content-type':'application/json'},
        body:JSON.stringify({action,appKey:CONNECT_APP,classId:host.classId,...payload})
       });
       const data=await response.json().catch(()=>({ok:false,error:'réponse illisible'}));
       if(!response.ok||data?.ok!==true)throw Error(data?.error||'séance indisponible');
       return data;
      },
      onClose:({sessionId,hostId,pageId})=>{
       if(!teacherPlayer||!closeToken)return;
       try{void fetch(CONNECT_URL+'/functions/v1/connect-guided-written',{
        method:'POST',keepalive:true,cache:'no-store',
        headers:{apikey:host.apikey,authorization:'Bearer '+closeToken,'content-type':'application/json'},
        body:JSON.stringify({action:'closing',appKey:CONNECT_APP,classId:host.classId,sessionId,hostId,pageId})
       }).catch(()=>{})}catch{}
      }
     });
     frame.addEventListener('load',()=>collective?.mount());
    }catch(error){console.warn('Guidé collectif non chargé ; autres modes préservés.',error)}
   }
   frame.srcdoc=game;
  }catch(e){output.textContent='Erreur : '+e.message}
})();
</script></body></html>
