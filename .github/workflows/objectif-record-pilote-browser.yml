name: LAB Objectif record - pont navigateur pilote
on:
  pull_request:
    paths:
      - 'essais/objectif-record-pilote.*'
      - 'tests/objectif-record-pilote-browser.e2e.mjs'
      - '.github/workflows/objectif-record-pilote-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/objectif-record-pilote-browser.e2e.mjs
