name: La moitié - PostgreSQL et contrat Edge isolés
on:
  pull_request:
    paths:
      - 'apps/DIV-Milieu-de-segment-1/**'
      - 'supabase/functions/connect-milieu/**'
      - 'supabase/release-candidates/*milieu*'
      - 'tests/milieu*'
      - '.github/workflows/milieu-connect-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: milieu_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milieu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 55432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: milieu_test
      MILIEU_LOCAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Schéma fictif et candidat fermé
        run: |
          set -euo pipefail
          for fixture in tests/postgres/calculs-melanges-fixture.sql tests/postgres/calculs-melanges-auth-fixture.sql supabase/release-candidates/20261031_permanent_trophies_hub_v1.sql; do
            psql -v ON_ERROR_STOP=1 -f "$fixture"
          done
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.connect_projection_score_events(student_id uuid,class_id uuid,app_key text,event_id uuid,game_mode text,game_score int,game_total int,game_points int,played_at timestamptz,captured_at timestamptz default now(),PRIMARY KEY(student_id,app_key,event_id));
          CREATE TABLE public.connect_projection_score_consents(student_id uuid,class_id uuid,app_key text,event_id uuid,consented_at timestamptz default now(),PRIMARY KEY(student_id,app_key,event_id));
          CREATE TABLE public.connect_projection_score_periods(class_id uuid,app_key text,score_since timestamptz,PRIMARY KEY(class_id,app_key));
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/release-candidates/20261126_milieu_connect_v2_candidate.sql
      - run: npm install --no-save --no-package-lock pg@8.16.3
      - run: node --test tests/milieu-connect.runtime.mjs
