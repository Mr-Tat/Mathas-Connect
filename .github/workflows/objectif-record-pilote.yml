name: Laboratoire - pilote Objectif record, invariants
on:
  pull_request:
    paths:
      - 'supabase/functions/connect-record-pilot/**'
      - 'supabase/migrations/*objectif_record_pilot*'
      - 'essais/objectif-record-pilote.*'
      - 'tests/objectif-record-pilote.test.mjs'
      - '.github/workflows/objectif-record-pilote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check essais/objectif-record-pilote.js
      - run: node --test tests/objectif-record-pilote.test.mjs
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check supabase/functions/connect-record-pilot/index.ts
