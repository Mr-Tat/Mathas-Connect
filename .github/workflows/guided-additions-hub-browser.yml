name: Guidé collectif des additions scolaires — Chromium
on:
  pull_request:
    paths:
      - 'apps/objective-record/guided-*'
      - 'apps/objective-record/guided-addition-simple/**'
      - 'apps/objective-record/eleve.mjs'
      - 'apps/objective-record/engines/addition-simple/**'
      - 'apps/objective-record/engines/addition-multiple/**'
      - 'tests/objective-record-guided-additions.browser.mjs'
      - '.github/workflows/guided-additions-hub-browser.yml'
permissions:
  contents: read
jobs:
  hosted-guided-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium sans accès à des données élèves
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Contrôler le vrai moteur et le bouton professeur/élève
        run: node --test tests/objective-record-guided-additions.browser.mjs
