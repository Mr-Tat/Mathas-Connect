name: Objectif record - Mélange TEST XP + tableau Chromium (APIs simulées)
on:
  pull_request:
    paths:
      - 'apps/objective-record/eleve.mjs'
      - 'apps/objective-record/mixed-test-proof.mjs'
      - 'apps/objective-record/atomic-test-recorder.mjs'
      - 'apps/objective-record/engines/melange/**'
      - 'tests/objective-record-mixed-native.browser.mjs'
      - '.github/workflows/objective-record-mixed-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium hors ligne (aucune donnée Supabase réelle)
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: TEST Mélange : journal des familles, reçu XP serveur, consentement projection
        run: node --test tests/objective-record-mixed-native.browser.mjs
