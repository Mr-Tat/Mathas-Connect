name: Projection V2 — Consentement scores privé
on:
  pull_request:
    paths:
      - 'supabase/release-candidates/20261031_projection_v2_explicit_score_consent.sql'
      - 'tests/postgres/projection-consent-contract.sql'
      - '.github/workflows/projection-consent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: projection_consent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projection_consent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: projection_consent_test
    steps:
      - uses: actions/checkout@v4
      - name: Tester le consentement sans toucher aux vrais élèves
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/postgres/projection-consent-contract.sql
