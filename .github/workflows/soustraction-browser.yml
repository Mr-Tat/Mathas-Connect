name: Soustraction browser smoke (isolated)
on:
  pull_request:
    paths:
      - 'apps/soustraction-simple/**'
      - 'tests/soustraction-browser.browser.mjs'
      - '.github/workflows/soustraction-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Browser smoke test (network fully mocked)
        run: node --test tests/soustraction-browser.browser.mjs
