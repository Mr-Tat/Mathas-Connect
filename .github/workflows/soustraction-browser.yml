name: Soustraction browser smoke (isolated)
on:
  pull_request:
    paths:
      - 'apps/soustraction-simple/**'
      - 'tests/soustraction-browser.browser.mjs'
      - 'tests/soustraction-certified.browser.mjs'
      - 'tests/soustraction-certified-client.test.mjs'
      - '.github/workflows/soustraction-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Contrats mathématiques et reprises
        run: node --test tests/soustraction-certified-client.test.mjs
      - name: Moteur autonome libre préservé
        run: |
          node --test --test-name-pattern='Chromium réel : lanceur libre' tests/soustraction-browser.browser.mjs
      - name: Vrais clics, défi certifié, XP et consentement (réseau simulé)
        run: node --test tests/soustraction-certified.browser.mjs
