name: Soustraction PostgreSQL isolated
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261028_soustraction_connect_v1.sql'
      - 'tests/sql/soustraction-pg-fixture.sql'
      - 'tests/sql/soustraction-pg-scenarios.sql'
      - 'tests/soustraction-edge-postgres.runtime.test.mjs'
      - 'supabase/functions/connect-results/index.ts'
      - 'supabase/functions/connect-soustraction-school/**'
      - 'supabase/release-candidates/20261127_soustraction_certified_live_snapshot.sql'
      - 'supabase/migrations/20261127124500_school_dynamic_class_eligibility.sql'
      - '.github/workflows/soustraction-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xp-and-parcours:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local_fake_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: local_fake_only
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Create isolated schema and fake student
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/soustraction-pg-fixture.sql
      - name: Apply real Soustraction migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028_soustraction_connect_v1.sql
      - name: Repeat migration to verify idempotence
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028_soustraction_connect_v1.sql
      - name: Execute real XP, trophy milestones, teacher restart and ACL assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/soustraction-pg-scenarios.sql
      - name: Apply permanent-trophies candidate in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/release-candidates/20261031_permanent_trophies_hub_v1.sql
      - name: Prepare certified proof schema and isolated class
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.connect_classes(id uuid PRIMARY KEY);
          INSERT INTO public.connect_classes(id) VALUES('22222222-2222-4222-8222-222222222222') ON CONFLICT DO NOTHING;
          CREATE TABLE IF NOT EXISTS public.connect_teacher_players(teacher_id uuid PRIMARY KEY, student_id uuid);
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103120000_school_certified_additions_tables.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103130000_school_extended_sessions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261127124500_school_dynamic_class_eligibility.sql
          psql -v ON_ERROR_STOP=1 -f supabase/release-candidates/20261127_soustraction_certified_live_snapshot.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.connect_hub_presets(slug,label) VALUES('class-22222222222242228222222222222222','Classe fictive') ON CONFLICT DO NOTHING;
          INSERT INTO public.connect_hub_preset_entries(preset_slug,app_key,section,visible) VALUES('class-22222222222242228222222222222222','soustraction-ecrite-simple','calculs_ecrits',true) ON CONFLICT DO NOTHING;
          UPDATE public.connect_apps SET enabled=true WHERE app_key='soustraction-ecrite-simple';
          SQL
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer adaptateur PostgreSQL léger pour Edge runtime
        run: |
          npm install --no-save --no-package-lock pg@8.16.3 playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: 'Chromium vers Edge et PostgreSQL réel : XP et restauration'
        run: node --test tests/soustraction-edge-postgres.runtime.test.mjs
