name: Abaque laboratoire - moteur isole
on:
  push:
    branches: [feat/abaque-longueurs-laboratoire, feat/abaque-longueurs-interface]
  pull_request:
    paths:
      - 'apps/abaque-longueurs/**'
      - 'objective-record-lab-previews.mjs'
      - 'tests/abaque*'
      - 'tests/laboratoire-objective-record.test.mjs'
      - '.github/workflows/abaque-browser.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install chromium --with-deps
      - run: node --test tests/laboratoire-objective-record.test.mjs tests/abaque-contract.test.mjs tests/global-catalog.test.mjs
      - name: Tester le moteur dans Chromium
        shell: bash
        env:
          CHROME_BIN: ''
        run: |
          set +e
          node --test tests/abaque-browser.browser.mjs 2>&1 | tee "$RUNNER_TEMP/abaque-browser.tap"
          test_status=${PIPESTATUS[0]}
          set -e
          exit "$test_status"
      - name: Conserver le résultat dans le résumé public de la CI
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/abaque-browser.tap"; then
            {
              echo '### Abaque — tests Chromium avec données fictives'
              echo '```text'
              cat "$RUNNER_TEMP/abaque-browser.tap"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
