name: Abaque laboratoire - moteur isole
on:
  push:
    branches: [feat/abaque-longueurs-laboratoire, feat/abaque-longueurs-interface]
  pull_request:
    paths:
      - 'apps/abaque-longueurs/**'
      - 'objective-record-lab-previews.mjs'
      - 'tests/abaque*'
      - 'tests/laboratoire-objective-record.test.mjs'
      - '.github/workflows/abaque-browser.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --no-save --no-package-lock playwright@1.57.0
      - run: npx playwright install chromium --with-deps
      - name: Vérifier aussi la régression Node commune avant publication
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/abaque-node.tap"
          test_status=${PIPESTATUS[0]}
          set -e
          exit "$test_status"
      - name: Tester le moteur dans Chromium
        shell: bash
        env:
          CHROME_BIN: ''
        run: |
          set +e
          node --test tests/abaque-browser.browser.mjs 2>&1 | tee "$RUNNER_TEMP/abaque-browser.tap"
          test_status=${PIPESTATUS[0]}
          set -e
          exit "$test_status"
      - name: Conserver le résultat dans le résumé public de la CI
        if: always()
        shell: bash
        run: |
          for report in abaque-node abaque-browser; do
            if test -f "$RUNNER_TEMP/$report.tap"; then
              {
                echo "### Abaque — $report"
                echo '```text'
                cat "$RUNNER_TEMP/$report.tap"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
