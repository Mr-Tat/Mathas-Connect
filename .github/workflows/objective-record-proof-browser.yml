name: Objectif record - additions certifiées Chromium TEST (API simulée)
on:
  pull_request:
    paths:
      - 'apps/objective-record/eleve.*'
      - 'apps/objective-record/certified-addition*.mjs'
      - 'apps/objective-record/certified-multiple*.mjs'
      - 'apps/objective-record/engines/addition-simple/**'
      - 'apps/objective-record/engines/addition-multiple/**'
      - 'tests/objective-record-addition-proof.browser.mjs'
      - 'tests/objective-record-multiple-proof.browser.mjs'
      - 'tests/objective-record-additions-proof-only.browser.mjs'
      - 'tests/objective-record-additions-real-keyboard.browser.mjs'
      - 'tests/objective-record-official-addition-trophies.browser.mjs'
      - 'apps/objective-record/mixed-test-proof.mjs'
      - 'apps/objective-record/engines/melange/**'
      - 'tests/objective-record-mixed-native.browser.mjs'
      - '.github/workflows/objective-record-proof-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-certified-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium de recette sans données Supabase réelles
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Jeu natif, questions serveur et transmission des premiers chiffres/reports
        run: node --test tests/objective-record-addition-proof.browser.mjs tests/objective-record-multiple-proof.browser.mjs tests/objective-record-additions-proof-only.browser.mjs tests/objective-record-additions-real-keyboard.browser.mjs tests/objective-record-official-addition-trophies.browser.mjs tests/objective-record-mixed-native.browser.mjs
