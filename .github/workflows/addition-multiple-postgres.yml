name: Addition multiple PostgreSQL isolated
on:
  pull_request:
    paths:
      - 'tests/postgres/addition-multiple-*.sql'
      - 'supabase/migrations/20261029_addition_multiple_catalog_stage.sql'
      - '.github/workflows/addition-multiple-postgres.yml'
  workflow_dispatch:
jobs:
  sql-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing -d isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: testing
      PGPASSWORD: testing
      PGDATABASE: isolated
    steps:
      - uses: actions/checkout@v4
      - name: Create mock Supabase database roles
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated;'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role;'
      - name: Parse and install four XP and restart RPC candidates in disposable database
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-rpc-candidate.sql
      - name: Verify privileged RPC access is restricted
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-rpc-permissions.sql
      - name: Create pure isolated XP function
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-xp-preview.sql
      - name: Build isolated credit tables and transaction
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-credit-model.sql
      - name: Verify duplicate, conflict, rollback and XP
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-credit-assertions.sql
      - name: Verify student separation, XP milestones and hard challenge
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-isolation-assertions.sql
      - name: Create disposable catalog and XP rule tables from production metadata
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-catalog-fixture.sql
      - name: Run the real staged catalog migration twice (idempotence)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_addition_multiple_catalog_stage.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_addition_multiple_catalog_stage.sql
      - name: Assert all four HUB presets stay hidden and old records remain unchanged
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-catalog-assertions.sql
      - name: Build actual Connect state, student, credit and teacher-parcours tables in disposable database
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-real-rpc-fixture.sql
      - name: Execute real candidate XP and teacher RPCs with two fictitious pupils
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-real-rpc-assertions.sql
      - name: Install atomic record and XP transaction candidate (disabled in production)
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-atomic-rpc-candidate.sql
      - name: Test actual atomic record RPC, duplicate and failed XP rollback
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-atomic-rpc-assertions.sql
      - name: Verify examples and rejection without production database
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres/addition-multiple-xp-assertions.sql
