name: Soustraction production smoke (read-only)
on:
  push:
    branches: [main, fix/soustraction-live-smoke-20261031]
    paths:
      - 'tests/soustraction-live-readonly.mjs'
      - 'tests/soustraction-live-contract.mjs'
      - 'tests/soustraction-live-readonly.test.mjs'
      - '.github/workflows/soustraction-live-readonly.yml'
      - 'app.js'
      - 'apps/soustraction-simple/**'
      - 'assets/miniatures/soustraction-ecrite-simple.webp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le contrat du contrôle sans réseau
        run: node --test tests/soustraction-live-readonly.test.mjs tests/soustraction-teacher-runtime.test.mjs
      - name: Vérifier les URLs réelles sans utilisateur ni écriture
        run: node tests/soustraction-live-readonly.mjs
