name: Objectif record - ledger PostgreSQL candidat (sans production)
on:
  pull_request:
    paths:
      - 'supabase/release-candidates/objective_record_ledger_candidate.sql'
      - 'supabase/release-candidates/objective_record_sessions_candidate.sql'
      - 'tests/objective-record-ledger-candidate.sql'
      - 'tests/objective-record-sessions-candidate.sql'
      - '.github/workflows/objective-record-ledger-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-postgres:
    name: postgres-16-disposable
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: record_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d record_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/record_test
      PGCONNECT_TIMEOUT: '10'
    steps:
      - uses: actions/checkout@v4
      - name: Roles Supabase fictifs, dans la base ephemere uniquement
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
      - name: Installer le registre candidat sans acces public
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/release-candidates/objective_record_ledger_candidate.sql
      - name: Installer le magasin de sessions strictement prive
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/release-candidates/objective_record_sessions_candidate.sql
      - name: Tests SQL, droits, epoques, complements, idempotence et rollback
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/objective-record-ledger-candidate.sql
      - name: Sessions privees, preuve mathematique, rejeu et expiration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/objective-record-sessions-candidate.sql
      - name: Concurrence reelle, seize requetes au meme jalon
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for i in $(seq 1 16); do
            (
              id=$(printf '30000000-0000-4000-8000-%012d' "$i")
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "
                SET ROLE service_role;
                SELECT objective_record_candidate.credit_verified_event(
                  '11111111-1111-4111-8111-111111111111',
                  'melange-calculs-ecrits',9,2,'add,sub',3,'record:10','sudden',
                  '$id'::uuid,'{\"source\":\"parallel-fixture\"}'::jsonb);
              " > /dev/null
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT credited FROM objective_record_candidate.credits
               WHERE student_id='11111111-1111-4111-8111-111111111111'
               AND app_key='melange-calculs-ecrits' AND scope_epoch=9
               AND operations_key='add,sub' AND level=2 AND milestone='record:10') <> 11
            THEN RAISE EXCEPTION 'concurrent_over_or_under_credit'; END IF;
            IF (SELECT count(*) FROM objective_record_candidate.receipts
               WHERE event_id::text LIKE '30000000-0000-4000-8000-%') <> 16
            THEN RAISE EXCEPTION 'concurrent_receipt_loss'; END IF;
          END $$;
          SQL
      - name: Concurrence batch 5 + 10 XP, seize parties simultanées
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO objective_record_candidate.authorizations
          (student_id,app_key,reset_epoch,ruleset_version,approved,repeat_xp)
          VALUES('44444444-4444-4444-8444-444444444444','melange-calculs-ecrits',7,3,true,false);
          SQL
          pids=()
          for i in $(seq 1 16); do
            (
              id=$(printf '40000000-0000-4000-8000-%012d' "$i")
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "
                SET ROLE service_role;
                SELECT objective_record_candidate.credit_verified_record(
                  '44444444-4444-4444-8444-444444444444','melange-calculs-ecrits',
                  7,2,'add,sub',3,'sudden','$id'::uuid,10,
                  '{\"source\":\"batch-parallel-fixture\"}'::jsonb);
              " > /dev/null
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $check_batch$
          BEGIN
            IF (SELECT count(*) FROM objective_record_candidate.credits
                WHERE student_id='44444444-4444-4444-8444-444444444444'
                AND operations_key='add,sub' AND credited IN (10,11)
                AND milestone IN ('record:5','record:10')) <> 2
            THEN RAISE EXCEPTION 'batch_concurrent_credit_missing';END IF;
            IF (SELECT coalesce(sum(xp_delta),-1) FROM objective_record_candidate.receipts
                WHERE student_id='44444444-4444-4444-8444-444444444444') <> 21
            THEN RAISE EXCEPTION 'batch_concurrent_over_credit';END IF;
            IF (SELECT count(*) FROM objective_record_candidate.receipts
                WHERE student_id='44444444-4444-4444-8444-444444444444') <> 16
            THEN RAISE EXCEPTION 'batch_concurrent_lost_receipt';END IF;
          END $check_batch$;
          SQL
      - name: Meme session envoyee simultanement 16 fois, un seul credit et un seul recu
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO objective_record_candidate.authorizations
          (student_id,app_key,reset_epoch,ruleset_version,approved,repeat_xp)
          VALUES('77777777-7777-4777-8777-777777777777','melange-calculs-ecrits',7,3,true,false);
          INSERT INTO objective_record_candidate.issued_sessions
          (session_id,student_id,app_key,reset_epoch,level,operations_key,ruleset_version,mode,questions,expires_at)
          SELECT '77777777-7777-4777-8777-777777777778',
          '77777777-7777-4777-8777-777777777777','melange-calculs-ecrits',
          7,2,'add,sub',3,'sudden',
          jsonb_agg(jsonb_build_object('id','q'||i,'op','add','a',i,'b',10) ORDER BY i),
          now()+interval '1 hour' FROM generate_series(1,12) q(i);
          SQL
          answers=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT jsonb_agg(jsonb_build_object('questionId','q'||i,'value',i+10) ORDER BY i)::text
            FROM generate_series(1,12) q(i)")
          pids=()
          for i in $(seq 1 16); do
            (
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -qAtc "
                SET ROLE service_role;
                SELECT objective_record_candidate.finish_issued_session(
                 '77777777-7777-4777-8777-777777777777',
                 '77777777-7777-4777-8777-777777777778','$answers'::jsonb);
              " > /dev/null
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $one_session_check$
          BEGIN
            IF (SELECT count(*) FROM objective_record_candidate.receipts
                WHERE student_id='77777777-7777-4777-8777-777777777777') <> 1
            THEN RAISE EXCEPTION 'same_session_created_multiple_receipts'; END IF;
            IF (SELECT coalesce(sum(xp_delta),-1) FROM objective_record_candidate.receipts
                WHERE student_id='77777777-7777-4777-8777-777777777777') <> 21
            THEN RAISE EXCEPTION 'same_session_xp_not_exactly_21'; END IF;
            IF (SELECT count(*) FROM objective_record_candidate.credits
                WHERE student_id='77777777-7777-4777-8777-777777777777'
                AND milestone IN ('record:5','record:10') AND credited IN (10,11)) <> 2
            THEN RAISE EXCEPTION 'same_session_credit_rows_missing'; END IF;
            IF (SELECT consumed_at FROM objective_record_candidate.issued_sessions
                WHERE session_id='77777777-7777-4777-8777-777777777778') IS NULL
            THEN RAISE EXCEPTION 'session_not_consumed';END IF;
          END $one_session_check$;
          SQL
      - name: Verify that web roles have no schema access
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN has_schema_privilege('anon','objective_record_candidate','USAGE') OR has_schema_privilege('authenticated','objective_record_candidate','USAGE') THEN 1 ELSE 0 END" | grep -qx 0
