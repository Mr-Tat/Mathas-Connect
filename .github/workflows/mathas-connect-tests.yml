name: Mathas Connect regression tests
on:
  push:
    branches: [main]
    paths:
      - 'apps/multiplication-simple/**'
      - 'apps/soustraction-simple/**'
      - 'tests/**'
      - 'projection.html'
      - 'projection.js'
      - 'projection-model.mjs'
      - 'supabase/functions/connect-results/**'
      - 'supabase/migrations/**'
      - '.github/workflows/mathas-connect-tests.yml'
  pull_request:
    paths:
      - 'apps/multiplication-simple/**'
      - 'apps/soustraction-simple/**'
      - 'tests/**'
      - 'projection.html'
      - 'projection.js'
      - 'projection-model.mjs'
      - 'supabase/functions/connect-results/**'
      - 'supabase/migrations/**'
      - '.github/workflows/mathas-connect-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Node regression tests
        run: node --test tests/*.test.mjs
