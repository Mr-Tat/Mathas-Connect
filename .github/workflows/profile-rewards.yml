name: Profils Connect — récompenses de niveaux
on:
  pull_request:
    paths:
      - 'profile-rewards.mjs'
      - 'profile-celebration.mjs'
      - 'avatar-catalog.js'
      - 'hub.js'
      - 'hub.html'
      - 'hub-profile.css'
      - 'app.js'
      - 'index.html'
      - 'join-avatar.js'
      - 'join-avatar.css'
      - 'supabase/functions/connect-api/**'
      - 'supabase/release-candidates/20261103_profile_rewards_initials_v1.sql'
      - 'supabase/release-candidates/20261103_profile_reward_celebrations_v1.sql'
      - 'supabase/release-candidates/20261104_profile_rewards_rethreshold_5_10_15_20_25.sql'
      - 'tests/profile-rewards*'
      - '.github/workflows/profile-rewards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrats de niveau et sécurité côté serveur
        run: node --test tests/profile-rewards.test.mjs tests/profile-celebrations.test.mjs
      - name: Installer Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Parcours profil complet (identité et XP factices)
        run: node --test tests/profile-rewards.browser.mjs tests/profile-celebrations.browser.mjs
