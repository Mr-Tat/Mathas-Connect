name: Import public images into Mathas Connect (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-connect-images.yml'
      - 'scripts/import-connect-images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Recuperer et optimiser les images publiques
        run: python scripts/import-connect-images.py
      - name: Publier les images dans Mathas Connect uniquement
        run: |
          git add assets/brand assets/miniatures assets/images-manifest.json
          if git diff --cached --quiet; then
            echo 'Aucune image modifiee'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assets Connect : miniatures et identite visuelle optimisees'
          git push
