name: Mathas Connect - backup and XP checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backup-weekly.mjs'
      - 'tests/backup-weekly.test.mjs'
      - 'tests/calculs-melanges-backup.test.mjs'
      - 'tests/xp-parcours-model.test.mjs'
      - '.github/workflows/connect-safety.yml'
  pull_request:
    paths:
      - 'scripts/backup-weekly.mjs'
      - 'tests/backup-weekly.test.mjs'
      - 'tests/calculs-melanges-backup.test.mjs'
      - 'tests/xp-parcours-model.test.mjs'
      - '.github/workflows/connect-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Includes checkout and Node setup on a cold hosted runner.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check encrypted backups and XP without hosted services
        timeout-minutes: 2
        run: node --test tests/backup-weekly.test.mjs tests/calculs-melanges-backup.test.mjs tests/xp-parcours-model.test.mjs
