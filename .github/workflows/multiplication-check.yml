name: Multiplication integration verification
on:
  push:
    branches: [integration/multiplication-simple]
    paths: ['apps/multiplication-simple/**', 'tests/multiplication-integration.test.mjs', 'tests/multiplication-connect.test.mjs', 'tests/multiplication-school-ui.test.mjs', 'tests/multiplication-certified.test.mjs', 'tests/multiplication-record-eligibility.test.mjs', 'tests/multiplication-restore-runtime.test.mjs', 'tests/multiplication-official-cups.test.mjs', 'tests/multiplication-school-visibility.test.mjs', 'supabase/functions/connect-multiplication-school/**', '.github/workflows/multiplication-check.yml']
  pull_request:
    paths: ['apps/multiplication-simple/**', 'tests/multiplication-integration.test.mjs', 'tests/multiplication-connect.test.mjs', 'tests/multiplication-school-ui.test.mjs', 'tests/multiplication-certified.test.mjs', 'tests/multiplication-record-eligibility.test.mjs', 'tests/multiplication-restore-runtime.test.mjs', 'tests/multiplication-official-cups.test.mjs', 'tests/multiplication-school-visibility.test.mjs', 'supabase/functions/connect-multiplication-school/**', '.github/workflows/multiplication-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test tests/multiplication-integration.test.mjs tests/multiplication-connect.test.mjs tests/multiplication-school-ui.test.mjs tests/multiplication-certified.test.mjs tests/multiplication-record-eligibility.test.mjs tests/multiplication-restore-runtime.test.mjs tests/multiplication-official-cups.test.mjs tests/multiplication-school-visibility.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/connect-multiplication-school/index.ts
