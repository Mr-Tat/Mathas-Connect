<!doctype html>
<html lang="fr"><head>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math’as Connect — Pilote Objectif record</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a172b;color:#eef7ff;font:14px system-ui}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#162b42;border-bottom:1px solid #35546f}
header strong{font-size:17px}header small{color:#c2dbec}main{display:flex;flex-direction:column;height:100dvh}
a{color:#bfe4ff}select,button{background:#253953;color:#fff;border:1px solid #66809a;border-radius:9px;padding:8px;font:inherit}
select{max-width:240px}button{cursor:pointer}button:disabled{opacity:.45}
#status{padding:7px 14px;background:#10263e;color:#ffe4ae;font-size:12px;min-height:32px}
#scoreboard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 14px;background:#172638;border-bottom:1px solid #3c5772}
#scoreboard>span{white-space:nowrap}#scoreboard b{color:#fee09b;font-size:17px}
#gameFrame{width:100%;height:auto;flex:1 1 auto;min-height:200px;border:0;background:#09192c}
#warning{font-size:11px;color:#bdcfdb}#error{color:#ffb5b5}
@media(max-width:600px){header{padding:8px;gap:6px}header strong{font-size:14px}select{max-width:180px}#scoreboard{gap:8px;padding:6px 9px;font-size:12px}}
</style></head><body><main>
<header><strong>🧪 Objectif record — pilote Connect</strong>
<label for="app">Jeu :
<select id="app"><option value="addition-simple">Addition simple</option>
<option value="addition-multiple">Addition multiple</option>
<option value="soustraction">Soustraction écrite</option>
<option value="multiplication">Multiplication simple</option>
<option value="melange">Mélange de calculs</option></select></label>
<a href="../laboratoire.html">Laboratoire professeur</a>
<a href="../hub.html">HUB</a>
<small id="warning">Classe TEST exclusivement · bilan XP pilote, distinct des vrais XP</small>
</header>
<div id="status" role="status" aria-live="polite">Vérification du compte de test…</div>
<section id="scoreboard" aria-label="Résultats persistants du pilote">
<span>⭐ XP pilote : <b id="xp">—</b></span>
<span>👑 Meilleur score : <b id="best">—</b></span>
<span>🏆 Trophées pilote : <b id="trophies">—</b></span>
<span>🧾 Dernières parties : <b id="attempts">—</b></span>
<button id="refresh" type="button">Actualiser</button>
</section>
<iframe id="gameFrame" title="Moteur Objectif record d'essai" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</main><script type="module" src="./objectif-record-pilote.js"></script></body></html>
